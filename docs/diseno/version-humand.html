<!-- Captura de la versión "estilo Humand" del panel (commit dd5c788,
     2026-10-07). Usa los mismos CSS que tenía la app en ese commit; el
     contenido de las pantallas es el del sistema, sin cambios. Se abre
     con doble clic, no necesita backend. -->
<style>
/* ===== styles.css (tokens y patrones globales) ===== */
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");


/* ==========================================================================
   Design tokens — Buen Vivir
   Única fuente de verdad de color, tipografía, espaciado, radios, sombras y
   movimiento. El tema de PrimeNG (src/app/theme/buen-vivir.preset.ts) lee
   estas mismas variables: cambiar un valor acá cambia también los
   componentes de PrimeNG. Ningún componente debería usar un hex suelto.
   ========================================================================== */
:root {
  /* ── Paletas: escalas 50–950 con el color base en el 600 ─────────────── */

  /* Verde institucional (manual de identidad, fondo del logo) */
  --green-50: #f0f2ef;
  --green-100: #e2e4df;
  --green-200: #c4cac0;
  --green-300: #a4ac9c;
  --green-400: #7f8a74;
  --green-500: #626f55;
  --green-600: #485839;
  --green-700: #3d4a30;
  --green-800: #323e28;
  --green-900: #283220;
  --green-950: #1f2819;

  /* Tierra / terracota (secundario del manual) */
  --earth-50: #f7f2f0;
  --earth-100: #efe5e1;
  --earth-200: #dfcbc3;
  --earth-300: #ccada1;
  --earth-400: #b88c7b;
  --earth-500: #a8725d;
  --earth-600: #9a5b43;
  --earth-700: #814b37;
  --earth-800: #6b3d2c;
  --earth-900: #552f21;
  --earth-950: #432418;

  /* Neutros cálidos (crema del manual en el 200, negro del manual en el 950) */
  --neutral-0: #ffffff;
  --neutral-50: #faf9f5;
  --neutral-100: #f3f2eb;
  --neutral-200: #e7e6da;
  --neutral-300: #d6d4c6;
  --neutral-400: #b3b1a2;
  --neutral-500: #8a887b;
  --neutral-600: #66655b;
  --neutral-700: #4a4943;
  --neutral-800: #33322e;
  --neutral-900: #262622;
  --neutral-950: #1d1d1b;

  /* Estados: rojo (error), ocre (aviso), azul pizarra (información) */
  --red-50: #f9eeed;
  --red-100: #f3dcdb;
  --red-200: #e7bab7;
  --red-300: #d9928e;
  --red-400: #ca6762;
  --red-500: #be443e;
  --red-600: #b3261e;
  --red-700: #951f19;
  --red-800: #7a1914;
  --red-900: #5f130f;
  --red-950: #490f0b;

  --ochre-50: #f6f2eb;
  --ochre-100: #ece5d6;
  --ochre-200: #dacaad;
  --ochre-300: #c4ac80;
  --ochre-400: #ad8c4c;
  --ochre-500: #9a7124;
  --ochre-600: #8a5a00;
  --ochre-700: #744b00;
  --ochre-800: #5f3e00;
  --ochre-900: #4b3000;
  --ochre-950: #3a2600;

  --blue-50: #f0f3f5;
  --blue-100: #e0e8ec;
  --blue-200: #c2d1d8;
  --blue-300: #9fb7c2;
  --blue-400: #799aaa;
  --blue-500: #5a8397;
  --blue-600: #3f6f86;
  --blue-700: #345c70;
  --blue-800: #2a4b5b;
  --blue-900: #203a47;
  --blue-950: #182d36;

  /* ── Colores semánticos (los que usan los componentes) ───────────────── */
  --color-primary: var(--green-600); /* texto blanco encima: 7.7:1 */
  --color-primary-hover: var(--green-700);
  --color-primary-active: var(--green-800);
  --color-primary-soft: var(--green-50);
  --color-primary-soft-strong: var(--green-100);
  --color-on-primary: var(--neutral-0);

  --color-secondary: var(--earth-600); /* texto blanco encima: 5.3:1 */
  --color-secondary-hover: var(--earth-700);
  --color-secondary-soft: var(--earth-50);

  --color-bg: var(--neutral-100); /* fondo de página: crema, no blanco */
  --color-surface: var(--neutral-0); /* tarjetas, diálogos */
  --color-surface-alt: var(--neutral-100); /* bandas, filas alternas */
  --color-surface-cream: var(--neutral-200); /* crema del manual */
  --color-surface-dark: var(--neutral-950);

  --color-border: var(--neutral-200); /* separadores decorativos */
  --color-border-strong: var(--neutral-500); /* bordes de campos: 3.6:1 */

  --color-text: var(--neutral-950); /* 16:1 sobre el fondo */
  --color-text-muted: var(--neutral-600); /* 4.7:1 incluso sobre crema */
  --color-text-inverse: var(--neutral-0);
  --color-link: var(--green-700);

  --color-success: var(--green-600);
  --color-success-soft: var(--green-50);
  --color-warning: var(--ochre-600);
  --color-warning-soft: var(--ochre-50);
  --color-danger: var(--red-600);
  --color-danger-soft: var(--red-50);
  --color-info: var(--blue-600);
  --color-info-soft: var(--blue-50);

  --color-focus: var(--green-600);
  --color-overlay: rgb(29 29 27 / 0.45);

  /* ── Tipografía ──────────────────────────────────────────────────────
     Una sola familia: Poppins (secundaria del manual; la primaria, Palo
     Seco, no tiene versión web). Cuerpo de 16px por legibilidad.        */
  --font-family-base:
    "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Escala subida un paso (2026-10-06, pedido de la usuaria: letra más
     grande). La landing usa sus propios clamp() y no cambia. */
  --font-size-xs: 0.8125rem; /* 13px: ayudas, metadatos */
  --font-size-sm: 0.9375rem; /* 15px: etiquetas de campo, tablas */
  --font-size-base: 1.0625rem; /* 17px: cuerpo */
  --font-size-lg: 1.1875rem; /* 19px: cuerpo destacado */
  --font-size-xl: 1.375rem; /* 22px: subtítulo */
  --font-size-2xl: 1.625rem; /* 26px: título de sección o tarjeta */
  --font-size-3xl: 2rem; /* 32px: título de página */
  --font-size-4xl: 2.25rem; /* 36px: títulos de landing */
  --font-size-5xl: 3rem; /* 48px: hero */
  /* Título de página del panel: 26px en celular, 34px en escritorio */
  --font-size-page-title: clamp(1.625rem, 1.35rem + 1.1vw, 2.125rem);

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-snug: 1.4;
  --line-height-base: 1.6;
  --letter-spacing-heading: -0.01em;

  /* ── Espaciado (múltiplos de 4px) ────────────────────────────────────── */
  --space-0: 0;
  --space-1: 0.25rem; /* 4px */
  --space-2: 0.5rem; /* 8px */
  --space-3: 0.75rem; /* 12px */
  --space-4: 1rem; /* 16px */
  --space-5: 1.25rem; /* 20px */
  --space-6: 1.5rem; /* 24px */
  --space-8: 2rem; /* 32px */
  --space-10: 2.5rem; /* 40px */
  --space-12: 3rem; /* 48px */
  --space-16: 4rem; /* 64px */
  --space-20: 5rem; /* 80px */
  --space-24: 6rem; /* 96px */

  /* ── Radios ──────────────────────────────────────────────────────────── */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Sombras (tinte del negro del manual, no gris frío) ──────────────── */
  --shadow-xs: 0 1px 2px rgb(29 29 27 / 0.06);
  --shadow-sm: 0 1px 3px rgb(29 29 27 / 0.08), 0 1px 2px rgb(29 29 27 / 0.04);
  --shadow-md:
    0 4px 8px -2px rgb(29 29 27 / 0.08), 0 2px 4px -2px rgb(29 29 27 / 0.05);
  --shadow-lg:
    0 12px 24px -6px rgb(29 29 27 / 0.12), 0 4px 8px -4px rgb(29 29 27 / 0.06);
  --focus-ring: 0 0 0 3px
    color-mix(in srgb, var(--color-focus) 35%, transparent);

  /* ── Movimiento (anulado por prefers-reduced-motion, ver abajo) ──────── */
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 300ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  /* Transición estándar de elementos interactivos: solo propiedades que
     el navegador anima barato (nunca `all`, que también anima el layout). */
  --transition-interactive:
    color var(--duration-base) var(--ease-standard),
    background-color var(--duration-base) var(--ease-standard),
    border-color var(--duration-base) var(--ease-standard),
    box-shadow var(--duration-base) var(--ease-standard),
    opacity var(--duration-base) var(--ease-standard),
    transform var(--duration-base) var(--ease-standard);

  /* ── Layout ──────────────────────────────────────────────────────────── */
  --container-max: 1200px;
  --container-gutter: var(--space-4);
  --tap-target: 44px; /* área táctil mínima (WCAG 2.5.5) */
  --header-height: 64px;
  --sidebar-width: 264px; /* barra lateral del panel (escritorio) */

  /* ── Alias heredados ─────────────────────────────────────────────────
     Nombres que ya usan los componentes. Apuntan a los tokens nuevos y se
     van reemplazando pantalla por pantalla.                            */
  --primary: var(--color-primary);
  --primary-hover: var(--color-primary-hover);
  --primary-10: color-mix(in srgb, var(--color-primary) 10%, transparent);
  --primary-20: color-mix(in srgb, var(--color-primary) 20%, transparent);
  --secondary: var(--color-secondary);
  --secondary-10: color-mix(in srgb, var(--color-secondary) 10%, transparent);
  --bg-white: var(--color-surface);
  --bg-cream: var(--color-surface-cream);
  --bg-dark: var(--color-surface-dark);
  --text-main: var(--color-text);
  --text-muted: var(--color-text-muted);
  --text-inverse: var(--color-text-inverse);
  --border: var(--color-border);
  --primary-foreground: var(--color-on-primary);
  --destructive: var(--color-danger);
}

/* ==========================================================================
   Base
   ========================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  background-color: var(--color-bg);
  color: var(--color-text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4,
h5,
.brand-name,
.page-title {
  font-family: var(--font-family-base);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-heading);
}

a {
  color: var(--color-link);
}

img,
video {
  max-width: 100%;
}

::selection {
  background: var(--color-primary-soft-strong);
  color: var(--color-text);
}

/* Foco visible para teclado en toda la app (WCAG 2.4.7). Solo con
   :focus-visible: el clic con mouse no deja el anillo. Los componentes de
   PrimeNG usan su propio focusRing, configurado con el mismo color. */
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* Contenedores que reciben foco por código (destino de "Saltar al
   contenido"): no son interactivos, no llevan anillo. */
[tabindex="-1"]:focus {
  outline: none;
}

/* Texto solo para lectores de pantalla */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ==========================================================================
   Patrones de página del panel (una sola definición para todas las
   pantallas; los componentes solo agregan lo propio)
   ========================================================================== */
.page-container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: var(--space-6) var(--container-gutter) var(--space-12);
}

/* Contenedor de las pantallas con barra lateral (dashboard y mi cuenta):
   en escritorio deja lugar a la barra fija; en celular ocupa todo. */
@media (min-width: 961px) {
  .app-shell {
    padding-left: var(--sidebar-width);
  }
}

/* Encabezado de página como franja propia (fondo blanco y filete verde a
   la izquierda): da estructura sobre el fondo crema en vez de un título
   suelto sobre blanco. */
.header-section {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  padding: var(--space-5) var(--space-6);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
}

.page-title {
  margin: 0 0 var(--space-1);
  font-size: var(--font-size-page-title);
  font-weight: var(--font-weight-semibold);
  color: var(--color-text);
}

.page-subtitle {
  margin: 0;
  max-width: 65ch;
  color: var(--color-text-muted);
}

/* Texto de ayuda debajo de un campo */
.input-hint {
  margin: var(--space-2) 0 0;
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

/* En celular, título y acciones del encabezado van uno debajo del otro */
@media (max-width: 767px) {
  .header-section {
    flex-direction: column;
    align-items: stretch;
  }
}

/* ==========================================================================
   Superficies de PrimeNG con más presencia (2026-10-06): tarjetas con borde
   y sombra sobre el fondo crema, encabezados de tabla y de diálogo en verde
   suave en lugar de blanco sobre blanco.
   ========================================================================== */
.p-card {
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}

.p-card .p-card-title {
  color: var(--color-primary);
}

.p-datatable .p-datatable-thead > tr > th {
  background: var(--color-primary-soft-strong);
  color: var(--green-900);
  font-weight: var(--font-weight-semibold);
}

.p-datatable .p-datatable-tbody > tr:nth-child(even) > td {
  background: var(--color-surface-alt);
}

.p-dialog .p-dialog-header {
  background: var(--color-primary-soft);
  border-bottom: 1px solid var(--color-border);
}

/* Fila de "sin resultados" dentro de una tabla (pTemplate="emptymessage") */
td.empty-state {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  color: var(--color-text-muted);
}

@media (min-width: 768px) {
  .page-container {
    padding-left: var(--space-8);
    padding-right: var(--space-8);
  }
}

/* Cambio de pantalla: fundido corto entre rutas (View Transitions API,
   activada con withViewTransitions() en app.config.ts). Los navegadores
   sin soporte cambian de pantalla como antes. */
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: var(--duration-slow);
  animation-timing-function: var(--ease-standard);
}

/* Respeta la preferencia del sistema de reducir movimiento (WCAG 2.3.3) */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation: none !important;
  }
}

/* ── Utilities ── */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-6);
}
.text-center {

.gap-1 {

/* Colors */
.text-muted {
  color: var(--text-muted);
}

  color: var(--primary);
}
.text-secondary {
  color: var(--secondary);
}
.text-white {
  color: var(--color-text-inverse);
}
.text-inverse {
  color: var(--text-inverse);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-target);
  padding: var(--space-2) var(--space-5);
  border-radius: var(--radius-md);
  font-weight: var(--font-weight-medium);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition:
    background-color var(--duration-base) var(--ease-standard),
    border-color var(--duration-base) var(--ease-standard),
    color var(--duration-base) var(--ease-standard);
  border: 1.5px solid transparent;
  text-decoration: none;
  font-family: inherit;
}
.btn-primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}
.btn-outline-white {
  border: 1.5px solid rgb(255 255 255 / 0.6);
  color: var(--color-text-inverse);
  background: transparent;
}
.btn-outline-white:hover {
  background: rgb(255 255 255 / 0.15);
}
.btn-outline-primary {
  border: 2px solid var(--primary);
  color: var(--primary);
  background: transparent;
}
.btn-outline-primary:hover {
  background: var(--primary-10);
}
.btn-white {
  background: var(--color-surface);
  color: var(--color-primary);
  border-color: var(--color-surface);
}
.btn-white:hover {
  background: var(--color-surface-alt);
}
.btn-lg {
  padding: var(--space-3) var(--space-8);
  font-size: var(--font-size-base);
}

/* Cards */
.card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
  transition:
    border-color var(--duration-base) var(--ease-standard),
    box-shadow var(--duration-base) var(--ease-standard);
}
.card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

/* Grid columns */
.grid-cols-1 {
  grid-template-columns: repeat(1, minmax(0, 1fr));
}
.grid-cols-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid-cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grid-cols-4 {

/* ===== header.component.css (barra lateral + barra superior) ===== */
/* Navegación del panel al estilo de las apps de comunidad tipo Humand:
   barra lateral blanca fija con ícono + texto por sección y barra superior
   fina con notificaciones y avatar. En celular/tablet la barra lateral es
   un panel que se abre con el botón de menú.
   Sin encapsulación: todo va bajo .app-header (salvo el menú de usuario,
   que PrimeNG monta en <body>). El corrimiento del contenido lo da
   .app-shell en styles.css. */

/* ── Barra lateral ─────────────────────────────────────────────────────── */
.app-header .app-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 120;
  display: flex;
  flex-direction: column;
  width: var(--sidebar-width);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
}

.app-header .sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: var(--header-height);
  padding: var(--space-3) var(--space-4);
}

.app-header .sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) var(--space-3) var(--space-6);
}

.app-header .nav-list,
.app-header .nav-sublist {
  margin: 0;
  padding: 0;
  list-style: none;
}

.app-header .nav-entry + .nav-entry {
  margin-top: var(--space-1);
}

.app-header .nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 48px;
  padding: var(--space-2) var(--space-3);
  border: none;
  border-radius: var(--radius-lg);
  background: transparent;
  color: var(--color-text);
  font: inherit;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: var(--transition-interactive);
}

.app-header .nav-item:hover {
  background: var(--color-surface-alt);
}

.app-header .nav-icon {
  display: inline-flex;
  color: var(--color-text-muted);
  transition: var(--transition-interactive);
}

.app-header .nav-label {
  flex: 1;
  min-width: 0;
}

/* Sección actual: pastilla verde suave, ícono y texto en verde */
.app-header .nav-item.is-active,
.app-header .nav-group.has-active {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: var(--font-weight-semibold);
}

.app-header .nav-item.is-active .nav-icon,
.app-header .nav-group.has-active .nav-icon {
  color: var(--color-primary);
}

.app-header .nav-chevron {
  color: var(--color-text-muted);
  transition: transform var(--duration-base) var(--ease-standard);
}

.app-header .nav-group[aria-expanded="true"] .nav-chevron {
  transform: rotate(180deg);
}

/* Subítems: alineados con el texto del grupo y una guía vertical */
.app-header .nav-sublist {
  margin: var(--space-1) 0 var(--space-2) calc(var(--space-3) + 10px);
  padding-left: var(--space-4);
  border-left: 2px solid var(--color-border);
}

.app-header .nav-subitem {
  display: flex;
  align-items: center;
  min-height: 40px;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
  text-decoration: none;
  transition: var(--transition-interactive);
}

.app-header .nav-subitem:hover {
  background: var(--color-surface-alt);
  color: var(--color-text);
}

.app-header .nav-subitem.is-active {
  color: var(--color-primary);
  font-weight: var(--font-weight-semibold);
  background: var(--color-primary-soft);
}

/* ── Marca ─────────────────────────────────────────────────────────────── */
.app-header .brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  color: var(--color-text);
  text-decoration: none;
  border-radius: var(--radius-md);
}

.app-header .brand-logo {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-lg);
  flex-shrink: 0;
}

.app-header .brand-text {
  display: flex;
  flex-direction: column;
  line-height: var(--line-height-tight);
}

.app-header .brand-name {
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  color: var(--color-primary);
}

.app-header .brand-role {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

/* ── Barra superior ────────────────────────────────────────────────────── */
.app-header .app-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--header-height);
  padding: 0 var(--space-4);
  background: color-mix(in srgb, var(--color-surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-border);
}

.app-header .header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.app-header .icon-btn,
.app-header .user-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--tap-target);
  min-height: var(--tap-target);
  padding: 0 var(--space-2);
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--color-text);
  font: inherit;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  text-decoration: none;
  cursor: pointer;
  transition: var(--transition-interactive);
}

.app-header .icon-btn:hover,
.app-header .user-btn:hover {
  background: var(--color-surface-alt);
}

.app-header .user-btn {
  padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1);
  text-align: left;
}

/* Avatar con iniciales, como en el perfil de las apps de comunidad */
.app-header .avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-on-primary);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.02em;
}

.app-header .user-text {
  display: flex;
  flex-direction: column;
  line-height: var(--line-height-tight);
}

.app-header .user-name {
  max-width: 10rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-header .user-role {
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-regular);
  color: var(--color-text-muted);
}

.app-header .user-chevron {
  color: var(--color-text-muted);
}

/* Botones solo de celular/tablet */
.app-header .menu-toggle,
.app-header .sidebar-close {
  display: none;
}

.app-header .sidebar-backdrop {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: var(--color-overlay);
}

/* ── Saltar al contenido (visible solo con teclado) ────────────────────── */
.app-header .skip-link {
  position: fixed;
  left: var(--space-4);
  top: -100px;
  z-index: 200;
  padding: var(--space-2) var(--space-4);
  background: var(--color-primary);
  color: var(--color-on-primary);
  border-radius: var(--radius-md);
  text-decoration: none;
  font-weight: var(--font-weight-medium);
}

.app-header .skip-link:focus {
  top: var(--space-2);
}

/* ── Celular / tablet: la barra lateral pasa a ser un panel ────────────── */
@media (max-width: 960px) {
  .app-header .app-sidebar {
    width: min(var(--sidebar-width), 85vw);
    box-shadow: var(--shadow-lg);
    transform: translateX(-100%);
    visibility: hidden;
    transition:
      transform var(--duration-slow) var(--ease-standard),
      visibility var(--duration-slow);
  }

  .app-header.sidebar-open .app-sidebar {
    transform: none;
    visibility: visible;
  }

  .app-header .menu-toggle,
  .app-header .sidebar-close {
    display: inline-flex;
  }
}

@media (max-width: 480px) {
  .app-header .user-text,
  .app-header .user-chevron {
    display: none;
  }

  .app-header .user-btn {
    padding: var(--space-1);
  }
}

/* Menú de usuario (va en <body> por appendTo, fuera de .app-header) */
.user-menu.p-menu {
  min-width: 12rem;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}

.user-menu .p-menu-item-link {
  min-height: var(--tap-target);
}

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
// NAV_BY_ROLE tal cual estaba en header.component.ts (dd5c788)
const CURSOS_GESTION = { label: "Cursos", items: ["Catálogo de cursos", "Gestión de cursos", "Inscripciones"] };
const ASISTENCIA = { label: "Asistencia", items: ["Asistencia por curso", "Asistencia general"] };
const NAV = {
  role_admin: [{ label: "Dashboard" }, CURSOS_GESTION, ASISTENCIA,
    { label: "Participantes", items: ["Usuarios", "Promoción humana", "Seguimiento"] },
    { label: "Campañas" }, { label: "Inserción laboral" }],
  role_volunteer: [{ label: "Cursos", items: ["Catálogo de cursos", "Inscripciones"] }, ASISTENCIA,
    { label: "Participantes", items: ["Gestión de participantes", "Promoción humana", "Seguimiento"] },
    { label: "Inserción laboral" }],
  role_participant: [{ label: "Mis cursos" }, { label: "Mi proceso" }, { label: "Ofertas laborales" }, { label: "Mi CV" }],
  role_teacher: [{ label: "Mis cursos" }, { label: "Asistencia" }, { label: "Progreso" }, { label: "Seguimiento" }],
  role_company: [{ label: "Ofertas laborales" }, { label: "Contacto con el centro" }],
};
const ICONS = { Dashboard: "layout-dashboard", Cursos: "book-open", "Mis cursos": "book-open",
  Asistencia: "calendar-check", Participantes: "users", "Campañas": "megaphone",
  "Inserción laboral": "briefcase", "Ofertas laborales": "briefcase", "Mi proceso": "sprout",
  "Mi CV": "file-text", Progreso: "trending-up", Seguimiento: "clipboard-list",
  "Contacto con el centro": "message-circle" };
const LABELS = { role_admin: "Responsable", role_volunteer: "Voluntariado", role_participant: "Participante",
  role_teacher: "Docente", role_company: "Empresa" };
// Docente y empresa no tienen Inicio: entran directo a su portal.
const HAS_INICIO = { role_admin: true, role_volunteer: true, role_participant: true };

let role = "role_admin";
let active = null;
const expanded = new Set();
const $ = (id) => document.getElementById(id);

function render() {
  $("brandRole").textContent = LABELS[role];
  $("userRole").textContent = LABELS[role];
  const ul = $("navList");
  ul.innerHTML = "";
  for (const item of NAV[role]) {
    const li = document.createElement("li");
    li.className = "nav-entry";
    const icon = '<span class="nav-icon"><i data-lucide="' + (ICONS[item.label] || "circle") + '"></i></span>';
    if (!item.items) {
      li.innerHTML = '<a href="#" class="nav-item' + (active === item.label ? " is-active" : "") + '">' + icon +
        '<span class="nav-label">' + item.label + "</span></a>";
      li.firstChild.onclick = (e) => { e.preventDefault(); go(item.label); };
    } else {
      const open = expanded.has(item.label);
      const groupActive = item.items.includes(active);
      let h = '<button type="button" class="nav-item nav-group' + (groupActive ? " has-active" : "") +
        '" aria-expanded="' + open + '">' + icon + '<span class="nav-label">' + item.label +
        '</span><i data-lucide="chevron-down" class="nav-chevron"></i></button>';
      if (open) {
        h += '<ul class="nav-sublist">' + item.items.map((c) =>
          '<li><a href="#" class="nav-subitem' + (active === c ? " is-active" : "") + '">' + c + "</a></li>").join("") + "</ul>";
      }
      li.innerHTML = h;
      li.querySelector("button").onclick = () => {
        if (open) expanded.delete(item.label); else expanded.add(item.label);
        render();
      };
      li.querySelectorAll(".nav-subitem").forEach((a, i) => {
        a.onclick = (e) => { e.preventDefault(); go(item.items[i], item.label); };
      });
    }
    ul.appendChild(li);
  }
  $("view").innerHTML = active
    ? '<div class="page-container"><div class="header-section"><div><h1 class="page-title">' + active +
      '</h1><p class="page-subtitle">Acá va la pantalla “' + active +
      '” tal como está en el sistema.</p></div></div><div class="demo-card">Contenido de la pantalla sin cambios.</div></div>'
    : '<section class="welcome"><div class="welcome-card"><h1 class="welcome-title">¡Bienvenido/a, Sofía!</h1>' +
      '<p class="welcome-role">Ingresaste como ' + LABELS[role] + "</p></div></section>";
  if (window.lucide) lucide.createIcons();
}
function home() { return HAS_INICIO[role] ? null : NAV[role][0].label; }
function go(label, group) {
  active = label;
  if (group) expanded.add(group);
  setOpen(false);
  render();
}
function setOpen(v) {
  $("appHeader").classList.toggle("sidebar-open", v);
  $("backdrop").hidden = !v;
}
$("roleSel").onchange = (e) => { role = e.target.value; expanded.clear(); active = home(); render(); };
document.querySelector(".brand").onclick = (e) => { e.preventDefault(); active = home(); setOpen(false); render(); };
$("menuBtn").onclick = () => setOpen(!$("appHeader").classList.contains("sidebar-open"));
$("closeBtn").onclick = () => setOpen(false);
$("backdrop").onclick = () => setOpen(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
render();
</script>
</body>
</html>
