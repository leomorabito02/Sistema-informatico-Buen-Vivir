syntax = "proto3";

package notification;

option go_package = "buenvivir/notifications/api/proto/notificationpb";

service NotificationIngestionService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc SendBatchNotifications(SendBatchNotificationsRequest) returns (SendBatchNotificationsResponse);
  rpc InitDefaultPreferences(InitDefaultPreferencesRequest) returns (InitDefaultPreferencesResponse);
}

message SendNotificationRequest {
  string source_service = 1;
  string event_type = 2;
  string category = 3;
  string priority = 4;
  string sender_type = 5;
  string sender_id = 6;
  string target_type = 7;
  string target_role = 8;
  repeated string recipient_user_ids = 9;
  string title = 10;
  string message = 11;
  string action_url = 12;
  string data_json = 13;
  bool is_critical = 14;
  bool send_email = 15;
  bool send_push = 16;
  bool send_in_app = 17;
}

message SendNotificationResponse {
  string notification_id = 1;
  int32 recipients_count = 2;
  string status = 3;
}

message SendBatchNotificationsRequest {
  repeated SendNotificationRequest notifications = 1;
}

message SendBatchNotificationsResponse {
  int32 created_count = 1;
  repeated string notification_ids = 2;
}

message InitDefaultPreferencesRequest {
  string user_id = 1;
}

message InitDefaultPreferencesResponse {
  string user_id = 1;
  bool success = 2;
  int32 count = 3;
}

