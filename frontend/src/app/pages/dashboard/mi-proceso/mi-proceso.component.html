<div class="page-container">
  <div class="header-section">
    <h1 class="page-title">Mi proceso</h1>
    <p class="page-subtitle">
      Los momentos importantes de tu recorrido en el centro.
    </p>
  </div>

  <app-loading-state
    *ngIf="loading"
    variant="list"
    label="Cargando tu línea de tiempo…"
  ></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [message]="error"
  ></app-error-state>

  <p-card *ngIf="!loading && !error" styleClass="p-card-shadow">
    <app-empty-state *ngIf="hitos.length === 0">
      Todavía no hay momentos registrados en tu línea de tiempo.
    </app-empty-state>

    <ol *ngIf="hitos.length > 0" class="timeline">
      <li *ngFor="let h of hitos" class="timeline-item">
        <span class="timeline-dot" aria-hidden="true"></span>
        <div class="timeline-content">
          <time class="timeline-date" [attr.datetime]="h.fecha">{{
            formatDMY(h.fecha)
          }}</time>
          <p class="texto-libre">{{ h.descripcion }}</p>
        </div>
      </li>
    </ol>
  </p-card>
</div>
