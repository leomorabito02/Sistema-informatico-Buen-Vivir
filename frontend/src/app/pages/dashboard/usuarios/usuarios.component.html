<div class="user-mgmt-container">
  <!-- Top Filter & Action Bar -->
  <div class="top-bar-card">
    <div class="search-input-wrapper">
      <label for="searchInput" class="sr-only" style="display: none"
        >Buscar usuarios</label
      >
      <i class="pi pi-search search-icon"></i>
      <input
        id="searchInput"
        type="text"
        [(ngModel)]="searchTerm"
        (input)="filterUsers()"
        placeholder="Buscar por nombre o email..."
        class="search-input"
      />
    </div>

    <div class="filter-actions-group">
      <div class="select-wrapper">
        <label for="roleSelect" class="sr-only" style="display: none"
          >Filtrar por rol</label
        >
        <select
          id="roleSelect"
          [(ngModel)]="selectedRole"
          (change)="filterUsers()"
          class="role-select"
        >
          <option *ngFor="let role of rolesList" [value]="role">
            {{ role }}
          </option>
        </select>
        <i class="pi pi-chevron-down select-icon"></i>
      </div>

      <button type="button" class="btn-new-user">
        <i class="pi pi-plus"></i>
        <span>Nuevo Usuario</span>
      </button>
    </div>
  </div>

  <!-- Data Table Card -->
  <div class="table-card">
    <table class="custom-user-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Cursos</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>
            <div class="user-profile-cell">
              <div class="avatar-circle">
                <i class="pi pi-user"></i>
              </div>
              <span class="user-name">{{ user.name }}</span>
            </div>
          </td>
          <td class="user-email">{{ user.email }}</td>
          <td class="user-phone">{{ user.phone }}</td>
          <td>
            <span class="badge-role">{{ user.role }}</span>
          </td>
          <td>
            <span
              class="badge-status"
              [ngClass]="{
                'status-active': user.status === 'Activo',
                'status-pending': user.status === 'Pendiente',
              }"
            >
              {{ user.status }}
              <i
                class="pi"
                [ngClass]="{
                  'pi-info-circle': user.status === 'Activo',
                  'pi-check-circle': user.status === 'Pendiente',
                }"
              ></i>
            </span>
          </td>
          <td>
            <span class="unimplemented-text">No implementado aún</span>
          </td>
          <td class="actions-cell">
            <div class="action-buttons">
              <button
                type="button"
                class="btn-action btn-view"
                title="Ver detalle"
              >
                <i class="pi pi-eye"></i>
              </button>
              <button type="button" class="btn-action btn-edit" title="Editar">
                <i class="pi pi-pencil"></i>
              </button>
              <button
                type="button"
                class="btn-action btn-delete"
                title="Eliminar"
              >
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="filteredUsers.length === 0">
          <td colspan="7" class="empty-state-cell">
            No se encontraron usuarios que coincidan con la búsqueda.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
