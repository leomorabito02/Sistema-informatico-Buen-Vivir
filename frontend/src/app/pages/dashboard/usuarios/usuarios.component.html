<div class="page-container">
  <div class="header-section">
    <div>
      <h1 class="page-title">
        <i class="pi pi-users mr-2"></i>Gestión de Usuarios
      </h1>
      <p class="page-subtitle">
        Administración global de usuarios, roles y estados de acceso al sistema.
      </p>
    </div>
    <div class="header-actions">
      <div class="search-box p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="searchTerm"
          (input)="filterUsers()"
          placeholder="Buscar por nombre, email o rol..."
          class="p-inputtext-sm"
        />
      </div>
      <p-button
        label="Nuevo Usuario"
        icon="pi pi-user-plus"
        styleClass="p-button-success"
      ></p-button>
    </div>
  </div>

  <p-card styleClass="p-card-shadow">
    <p-table
      [value]="filteredUsers"
      [paginator]="true"
      [rows]="10"
      class="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo Electrónico</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Fecha Registro</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td><span class="p-column-title">ID</span>{{ user.id }}</td>
          <td>
            <span class="p-column-title">Nombre</span
            ><strong>{{ user.name }}</strong>
          </td>
          <td><span class="p-column-title">Email</span>{{ user.email }}</td>
          <td>
            <span class="p-column-title">Rol</span>
            <p-tag
              [value]="user.role"
              [severity]="getRoleSeverity(user.role)"
            ></p-tag>
          </td>
          <td>
            <span class="p-column-title">Estado</span>
            <p-tag
              [value]="user.status"
              [severity]="getStatusSeverity(user.status)"
            ></p-tag>
          </td>
          <td><span class="p-column-title">Registro</span>{{ user.date }}</td>
          <td>
            <span class="p-column-title">Acciones</span>
            <div class="action-buttons">
              <p-button
                icon="pi pi-pencil"
                styleClass="p-button-rounded p-button-outlined p-button-sm"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                styleClass="p-button-rounded p-button-danger p-button-outlined p-button-sm"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
