<div class="page-container">
  <div class="header-section">
    <div>
      <h1 class="page-title">
        <i class="pi pi-calendar-plus mr-2"></i>Asistencia de mis cursos
      </h1>
      <p class="page-subtitle">
        Historial de asistencia por actividad. Se completa solo: cuando un
        participante entrega una actividad, queda presente en esa actividad.
      </p>
    </div>
  </div>

  <p-message
    *ngIf="error"
    severity="error"
    [text]="error"
    styleClass="w-full"
  ></p-message>

  <div *ngIf="loadingCourses" class="state-box">
    <p-progressSpinner
      strokeWidth="4"
      [style]="{ width: '40px', height: '40px' }"
    ></p-progressSpinner>
    <span>Cargando tus cursos…</span>
  </div>

  <ng-container *ngIf="!loadingCourses">
    <p *ngIf="courseOptions.length === 0 && !error" class="empty-state">
      No tenés cursos publicados como docente responsable.
    </p>

    <div *ngIf="courseOptions.length > 0" class="toolbar">
      <div class="course-picker">
        <label for="curso-asistencia">Curso</label>
        <p-select
          inputId="curso-asistencia"
          [options]="courseOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedCourseId"
          (onChange)="onCourseChange()"
          placeholder="Elegí un curso"
          [style]="{ minWidth: '280px', width: '100%' }"
        ></p-select>
      </div>
      <p-button
        *ngIf="selectedCourseId"
        label="Gestionar actividades"
        icon="pi pi-list-check"
        [outlined]="true"
        [routerLink]="['/dashboard/cursos', selectedCourseId]"
      ></p-button>
    </div>

    <div *ngIf="loadingMatrix" class="state-box">
      <p-progressSpinner
        strokeWidth="4"
        [style]="{ width: '32px', height: '32px' }"
      ></p-progressSpinner>
      <span>Cargando asistencia…</span>
    </div>

    <app-attendance-matrix
      *ngIf="selectedCourseId && !loadingMatrix"
      [activities]="activities"
      [rows]="rows"
    ></app-attendance-matrix>
  </ng-container>
</div>
