<div class="auth-container">
  <div class="auth-content">
    <div class="auth-wrapper">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo-container">
          <img src="assets/logo.png" alt="Logo Buen Vivir" class="auth-logo" />
        </div>
        <h1 class="auth-title">Buen Vivir</h1>
        <p class="auth-subtitle">Centro de Ecología Integral</p>
      </div>

      <!-- Role selection card -->
      <div class="auth-card">
        <h2 class="auth-card-title">¿Con qué perfil querés ingresar?</h2>
        <p class="auth-card-description">
          Tu cuenta tiene múltiples perfiles. Seleccioná con cuál querés
          continuar.
        </p>

        <!-- Error message -->
        <div *ngIf="loginError" class="error-msg">
          <span class="error-icon">⚠️</span>
          <span>{{ loginError }}</span>
        </div>

        <!-- Account list -->
        <div class="accounts-list">
          <button
            *ngFor="let account of accounts"
            class="account-card"
            [class.loading]="loadingAccountId === account.user_id"
            [disabled]="loadingAccountId !== ''"
            (click)="selectAccount(account)"
            [id]="'select-role-' + account.role_id"
          >
            <div class="account-icon">
              {{ roleIcons[account.role_id] || "👤" }}
            </div>
            <div class="account-info">
              <span class="account-role-name">{{ account.role_name }}</span>
              <span
                class="account-status"
                [class.status-blocked]="account.status !== 'active'"
              >
                {{ account.status === "active" ? "Activo" : "Bloqueado" }}
              </span>
            </div>
            <div class="account-arrow">
              <span *ngIf="loadingAccountId === account.user_id" class="spinner"
                >⏳</span
              >
              <span *ngIf="loadingAccountId !== account.user_id">→</span>
            </div>
          </button>
        </div>
      </div>

      <div class="auth-footer">
        <a routerLink="/login" class="auth-link"
          >← Volver al inicio de sesión</a
        >
      </div>
    </div>
  </div>
</div>
