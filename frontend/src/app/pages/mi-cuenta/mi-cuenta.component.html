<div class="account-page-container app-shell">
  <app-header></app-header>

  <main
    id="contenido-principal"
    class="account-main page-container"
    tabindex="-1"
  >
    <!-- Mismo encabezado que el resto de las pantallas del panel -->
    <div class="header-section">
      <div>
        <h1 class="page-title">Mi Cuenta</h1>
        <p class="page-subtitle">
          Gestión de datos personales, seguridad y preferencias de privacidad.
        </p>
      </div>
      <app-back-link to="/dashboard" label="Volver al inicio"></app-back-link>
    </div>

    <!-- Sub-navigation Tabs -->
    <nav class="account-tabs mb-6" aria-label="Navegación de Mi Cuenta">
      <a
        routerLink="datos-personales"
        routerLinkActive="active"
        class="tab-link"
      >
        <lucide-angular
          [img]="UserIcon"
          class="icon-sm icon-mr"
        ></lucide-angular>
        Datos Personales
      </a>

      <a routerLink="seguridad" routerLinkActive="active" class="tab-link">
        <lucide-angular
          [img]="ShieldIcon"
          class="icon-sm icon-mr"
        ></lucide-angular>
        Seguridad
      </a>

      <a routerLink="privacidad" routerLinkActive="active" class="tab-link">
        <lucide-angular
          [img]="LockIcon"
          class="icon-sm icon-mr"
        ></lucide-angular>
        Privacidad y Datos (Ley 25.326)
      </a>
    </nav>

    <!-- Subroute View -->
    <div class="account-content-card">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-footer></app-footer>
</div>
