<div class="subroute-container">
  <h2 class="text-xl font-semibold mb-2 text-foreground">Datos Personales</h2>
  <p class="text-sm text-muted mb-6">
    Información de perfil y contacto registrada en la plataforma institucional
    del Centro de Ecología Integral Buen Vivir.
  </p>

  @if (isSaved) {
    <div class="alert alert-success mb-6">
      <lucide-angular
        [img]="CheckCircleIcon"
        class="icon-md icon-mr"
      ></lucide-angular>
      Tus datos personales se han actualizado correctamente.
    </div>
  }

  <form
    [formGroup]="profileForm"
    (ngSubmit)="onSubmit()"
    class="grid grid-cols-1 md-grid-cols-2 gap-4"
  >
    <div class="form-group">
      <label for="fullName">Nombre Completo *</label>
      <input
        id="fullName"
        type="text"
        formControlName="fullName"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="dni">DNI / Documento *</label>
      <input id="dni" type="text" formControlName="dni" class="form-control" />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico *</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="phone">Teléfono / WhatsApp *</label>
      <input
        id="phone"
        type="text"
        formControlName="phone"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="city">Ciudad / Localidad (Córdoba) *</label>
      <input
        id="city"
        type="text"
        formControlName="city"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="address">Dirección / Barrio *</label>
      <input
        id="address"
        type="text"
        formControlName="address"
        class="form-control"
      />
    </div>

    <div class="col-span-full mt-4">
      <button type="submit" class="btn btn-primary">
        <lucide-angular
          [img]="SaveIcon"
          class="icon-sm icon-mr"
        ></lucide-angular>
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
