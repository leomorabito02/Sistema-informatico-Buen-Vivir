<div class="auth-container">
  <div class="auth-content">
    <div class="auth-wrapper">
      <!-- Logo and Title -->
      <div class="auth-header">
        <div class="auth-logo-container">
          <img src="assets/logo.png" alt="Logo Buen Vivir" class="auth-logo">
        </div>
        <h1 class="auth-title">Buen Vivir</h1>
        <p class="auth-subtitle">Centro de Ecología Integral</p>
      </div>

      <!-- Login Form -->
      <div class="auth-card">
        <h2 class="auth-card-title">Iniciar Sesión</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-group">
            <label class="form-label">Tipo de Usuario (Demo)</label>
            <select
              class="form-select"
              [value]="selectedRole"
              (change)="onRoleChange($event)"
            >
              <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Email o Usuario</label>
            <div class="input-wrapper">
              <lucide-angular [img]="MailIcon" class="input-icon"></lucide-angular>
              <input
                type="email"
                formControlName="email"
                class="form-input"
                [ngClass]="{'invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
                placeholder="tu@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div class="input-wrapper">
              <lucide-angular [img]="LockIcon" class="input-icon"></lucide-angular>
              <input
                type="password"
                formControlName="password"
                class="form-input"
                [ngClass]="{'invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <div class="flex-between">
            <label class="checkbox-label">
              <input type="checkbox" class="checkbox-input" />
              <span>Recordarme</span>
            </label>
            <a routerLink="/recuperar-password" class="auth-link">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <div *ngIf="loginError" class="error-msg">
            <lucide-angular [img]="AlertCircleIcon" class="error-icon"></lucide-angular>
            <span>{{ loginError }}</span>
          </div>

          <button
            type="submit"
            [disabled]="locked || loginForm.invalid"
            class="btn-submit"
          >
            {{ locked ? 'Cuenta bloqueada' : 'Continuar' }}
          </button>
        </form>

        <div class="auth-divider">
          <div class="auth-divider-line"></div>
          <div class="auth-divider-text">
            <span>O continúa con</span>
          </div>
        </div>

        <button
          (click)="handleGoogleLogin()"
          class="btn-google"
        >
          <svg class="google-icon" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Google
        </button>
      </div>

      <div class="auth-footer">
        ¿No tienes cuenta?
        <a routerLink="/register" class="auth-link">Regístrate aquí</a>
        <br /><br />
        <a routerLink="/" class="auth-link">Volver a la pantalla principal</a>
      </div>
    </div>
  </div>
</div>
