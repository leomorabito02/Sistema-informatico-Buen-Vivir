<section class="location-section">
  <div class="container">
    <div class="text-center">
      <h2 class="section-title">¿Dónde estamos?</h2>
      <p class="section-subtitle">Encontranos en Alta Gracia, Córdoba</p>
    </div>

    <div class="location-grid">
      <div class="map-frame">
        <iframe
          title="Ubicación Centro Buen Vivir - Alta Gracia"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3394.453802785937!2d-64.44110042347975!3d-31.703496510191307!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x942d514992dfc029%3A0x7cc081b60f7da0c0!2sC.%20Rio%20Lindo%201376%2C%20Villa%20Los%20Aromos%2C%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1786738130777!5m2!1ses-419!2sar"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>

      <div class="location-info">
        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="MapPinIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Dirección</p>
            <p class="info-value">
              Calle Rio Lindo 1376<br />Los Aromos, Córdoba, Argentina
            </p>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="ClockIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Horario de atención</p>
            <p class="info-value">Lunes a Viernes<br />9:00 – 19:00 hs</p>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="PhoneIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Contacto</p>
            <p class="info-value">
              <a href="tel:+5493547612118">+54 9 3547 61 2118</a>
            </p>
            <p class="info-value">
              <a href="tel:+5493547456184">+54 9 3547 45 6184</a>
            </p>
            <p class="info-value">
              <a href="mailto:ceibuenvivir7&#64;gmail.com"
                >ceibuenvivir7&#64;gmail.com</a
              >
            </p>
          </div>
        </div>

        <a
          href="https://maps.app.goo.gl/UNK35sRwQLtWgBF87"
          target="_blank"
          rel="noopener noreferrer"
          class="maps-btn"
        >
          <lucide-angular [img]="MapPinIcon"></lucide-angular>
          Abrir en Google Maps
        </a>
      </div>
    </div>
  </div>
</section>
