<section class="location-section">
  <div class="container">
    <div class="text-center">
      <h2 class="section-title">¿Dónde estamos?</h2>
      <p class="section-subtitle">Encontranos en Alta Gracia, Córdoba</p>
    </div>

    <div class="location-grid">
      <div class="map-frame">
        <iframe
          title="Ubicación Centro Buen Vivir - Alta Gracia"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d26730.2!2d-64.4295!3d-31.6554!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x943285b2e7d3f2e5%3A0xb0a1f3e0c2d4e5f6!2sAlta%20Gracia%2C%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1680000000000!5m2!1ses-419!2sar"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <div class="location-info">
        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="MapPinIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Dirección</p>
            <p class="info-value">La Otra Orilla<br>Alta Gracia, Córdoba, Argentina</p>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="ClockIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Horario de atención</p>
            <p class="info-value">Lunes a Viernes<br>9:00 – 17:00 hs</p>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <lucide-angular [img]="PhoneIcon"></lucide-angular>
          </div>
          <div>
            <p class="info-label">Contacto</p>
            <p class="info-value">+54 9 3547 XXX-XXX<br>contacto&#64;buenvivir.org</p>
          </div>
        </div>

        <a
          href="https://maps.google.com/?q=Alta+Gracia,Cordoba,Argentina"
          target="_blank"
          rel="noopener noreferrer"
          class="maps-btn">
          <lucide-angular [img]="MapPinIcon"></lucide-angular>
          Abrir en Google Maps
        </a>
      </div>
    </div>
  </div>
</section>
