<section class="impact-section">
  <div class="container">
    <div class="text-center mb-12">
      <h2 class="section-title">Nuestro impacto</h2>
      <p class="section-subtitle">
        Transformando vidas a través del acompañamiento integral
      </p>
    </div>

    <div class="impact-grid">
      <div class="text-center">
        <div class="impact-number">{{ activeParticipants }}</div>
        <div class="impact-label">Participantes activos</div>
      </div>
      <div class="text-center">
        <div class="impact-number">{{ courses }}</div>
        <div class="impact-label">Cursos disponibles</div>
      </div>
      <div class="text-center">
        <div class="impact-number">{{ volunteers }}</div>
        <div class="impact-label">Voluntarios</div>
      </div>
    </div>
  </div>
</section>
