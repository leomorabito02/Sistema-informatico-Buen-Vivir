<div class="app-header" [class.sidebar-open]="sidebarOpen">
  <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

  <!-- Barra lateral: fija en escritorio, panel deslizable en celular -->
  <aside id="barra-lateral" class="app-sidebar" aria-label="Menú principal">
    <div class="sidebar-top">
      <a
        routerLink="/dashboard"
        class="brand"
        aria-label="Buen Vivir, ir al inicio"
      >
        <img
          src="assets/logo.png"
          alt=""
          class="brand-logo"
          width="40"
          height="40"
        />
        <span class="brand-text">
          <span class="brand-name">Buen Vivir</span>
          <span class="brand-role" *ngIf="roleLabel">{{ roleLabel }}</span>
        </span>
      </a>
      <button
        type="button"
        class="icon-btn sidebar-close"
        aria-label="Cerrar menú"
        (click)="closeSidebar()"
      >
        <lucide-icon [img]="X" [size]="20" aria-hidden="true"></lucide-icon>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li *ngFor="let item of items" class="nav-entry">
          <!-- Sección con link directo -->
          <a
            *ngIf="!item.items"
            class="nav-item"
            [routerLink]="item.routerLink"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="
              item.routerLinkActiveOptions ?? { exact: false }
            "
            ariaCurrentWhenActive="page"
          >
            <span class="nav-icon">
              <lucide-icon
                [img]="iconFor(item)"
                [size]="20"
                aria-hidden="true"
              ></lucide-icon>
            </span>
            <span class="nav-label">{{ item.label }}</span>
          </a>

          <!-- Grupo desplegable -->
          <ng-container *ngIf="item.items">
            <button
              type="button"
              class="nav-item nav-group"
              [class.has-active]="isGroupActive(item)"
              [attr.aria-expanded]="isExpanded(item)"
              (click)="toggleGroup(item)"
            >
              <span class="nav-icon">
                <lucide-icon
                  [img]="iconFor(item)"
                  [size]="20"
                  aria-hidden="true"
                ></lucide-icon>
              </span>
              <span class="nav-label">{{ item.label }}</span>
              <lucide-icon
                [img]="ChevronDown"
                [size]="16"
                class="nav-chevron"
                aria-hidden="true"
              ></lucide-icon>
            </button>
            <ul class="nav-sublist" *ngIf="isExpanded(item)">
              <li *ngFor="let child of item.items">
                <a
                  class="nav-subitem"
                  [routerLink]="child.routerLink"
                  routerLinkActive="is-active"
                  ariaCurrentWhenActive="page"
                  >{{ child.label }}</a
                >
              </li>
            </ul>
          </ng-container>
        </li>
      </ul>
    </nav>
  </aside>

  <div
    class="sidebar-backdrop"
    *ngIf="sidebarOpen"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <!-- Barra superior -->
  <header class="app-topbar">
    <button
      type="button"
      class="icon-btn menu-toggle"
      aria-label="Abrir menú"
      aria-controls="barra-lateral"
      [attr.aria-expanded]="sidebarOpen"
      (click)="toggleSidebar()"
    >
      <lucide-icon [img]="Menu" [size]="22" aria-hidden="true"></lucide-icon>
    </button>

    <div class="header-actions">
      <a
        routerLink="/dashboard/ayuda"
        class="icon-btn"
        aria-label="Ayuda"
        title="Ayuda (tecla ?)"
      >
        <lucide-icon
          [img]="CircleQuestionMark"
          [size]="20"
          aria-hidden="true"
        ></lucide-icon>
      </a>
      <a
        routerLink="/dashboard/notificaciones"
        [attr.aria-label]="
          unread() > 0
            ? 'Notificaciones: ' + unread() + ' sin leer'
            : 'Notificaciones'
        "
        title="Notificaciones"
        class="icon-btn notif-btn"
      >
        <lucide-icon [img]="Bell" [size]="20" aria-hidden="true"></lucide-icon>
        <span *ngIf="unread() > 0" class="notif-badge" aria-hidden="true">{{
          unread() > 99 ? "99+" : unread()
        }}</span>
      </a>

      <button
        type="button"
        class="user-btn"
        aria-haspopup="menu"
        aria-controls="menu-usuario"
        (click)="userMenu.toggle($event)"
      >
        <span class="avatar" aria-hidden="true">
          <img
            *ngIf="avatarUrl; else fallbackAvatar"
            [src]="avatarUrl"
            alt="Foto de perfil"
            class="avatar-img"
            (error)="onAvatarError()"
          />
          <ng-template #fallbackAvatar>
            <ng-container *ngIf="initials; else sinIniciales">{{
              initials
            }}</ng-container>
            <ng-template #sinIniciales>
              <lucide-icon [img]="CircleUserRound" [size]="20"></lucide-icon>
            </ng-template>
          </ng-template>
        </span>
        <span class="user-text">
          <span class="user-name">{{ firstName || "Mi cuenta" }}</span>
          <span class="user-role" *ngIf="roleLabel">{{ roleLabel }}</span>
        </span>
        <lucide-icon
          [img]="ChevronDown"
          [size]="16"
          class="user-chevron"
          aria-hidden="true"
        ></lucide-icon>
      </button>
      <p-menu
        #userMenu
        id="menu-usuario"
        [model]="userItems"
        [popup]="true"
        appendTo="body"
        styleClass="user-menu"
      ></p-menu>
    </div>
  </header>
</div>
