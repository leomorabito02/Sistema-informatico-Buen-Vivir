# Config del nginx que sirve el build de Angular dentro del contenedor
# `frontend`. Reemplaza al default.conf de la imagen nginx-unprivileged
# (que escucha en 8080 y NO tiene fallback de SPA).

server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip para los bundles
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos que NO se cachean (config runtime + shell + service worker)
    location = /index.html            { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /assets/env.js         { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /ngsw-worker.js        { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /ngsw.json             { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    # Assets con hash: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta desconocida -> index.html, y Angular
    # resuelve el routing del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
