services:
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - ./auth/.env
    environment:
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:8080
    ports:
      - "8082:8080"
      - "50051:50051"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
      - buenvivir-net

  education-service:
    build:
      context: ./education
      dockerfile: Dockerfile
    env_file:
      - ./education/.env
    ports:
      - "8210:8210"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
      - buenvivir-net

  labor-integration:
    build:
      context: ./labor-integration
      dockerfile: Dockerfile
    env_file:
      - ./labor-integration/.env
    environment:
      - AUTH_SERVICE_GRPC_TARGET=auth-service:50051
    ports:
      - "8310:8080"
    depends_on:
      - auth-service
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
      - buenvivir-net

  human-promotion:
    build:
      context: ./human-promotion
      dockerfile: Dockerfile
    env_file:
      - ./human-promotion/.env
    environment:
      - AUTH_SERVICE_GRPC_TARGET=auth-service:50051
      - EDUCATION_SERVICE_URL=http://education-service:8210
    ports:
      - "8085:8085"
    depends_on:
      - auth-service
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1"
    networks:
      - buenvivir-net

  # Dashboard (HU-52 a HU-55): agregador. Consulta a auth, education,
  # human-promotion y labor-integration con las credenciales del admin.
  # Sin puerto publicado: solo se llega por el API Gateway, que valida el
  # token y le pasa el rol (X-User-Role). Si dashboard/.env trae
  # JWT_SECRET, valida el token por su cuenta; con REPORTES_BUCKET y
  # credenciales de Google guarda el historial de reportes (HU-55).
  dashboard-service:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    env_file:
      - path: ./dashboard/.env
        required: false
    environment:
      - PORT=8090
      - AUTH_SERVICE_URL=http://auth-service:8080
      - EDUCATION_SERVICE_URL=http://education-service:8210
      - LABOR_SERVICE_URL=http://labor-integration:8080
      - HUMAN_PROMOTION_SERVICE_URL=http://human-promotion:8085
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - buenvivir-net

  # Campañas (HU-47 a HU-51): base propia en Firestore (colección
  # "campanas"). Valida el JWT por su cuenta, como human-promotion. Sin
  # puerto publicado: se llega por el API Gateway. Lee JWT_SECRET y las
  # credenciales de Firestore de campaigns/.env (ver .env.example); si el
  # archivo no existe, el resto del stack levanta igual.
  campaigns-service:
    build:
      context: ./campaigns
      dockerfile: Dockerfile
    env_file:
      - path: ./campaigns/.env
        required: false
    environment:
      - PORT=8080
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    cpus: "0.5"
  notifications-service:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    env_file:
      - path: ./notifications/.env
        required: false
    environment:
      - PORT=8080
      - GRPC_PORT=50052
    ports:
      - "8088:8080"
      - "50052:50052"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - buenvivir-net

  api-gateway:
    image: nginx:alpine
    container_name: buenvivir-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - education-service
      - rxresume-service
      - labor-integration
    restart: on-failure
    networks:
      - buenvivir-net

  rxresume-service:
    build:
      context: ./rxresume
      dockerfile: Dockerfile
    env_file:
      - ./rxresume/.env
    ports:
      - "8087:8080"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    depends_on:
      - cv-renderer
    networks:
      - buenvivir-net

  cv-renderer:
    build:
      context: ./frontend
      dockerfile: cv-engine/Dockerfile
    container_name: buenvivir-cv-renderer
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - buenvivir-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buenvivir-frontend
    ports:
      - "4200:8080"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - buenvivir-net

  # Emulador de Pub/Sub para probar los eventos en local (docs/eventos).
  # Va en el perfil "eventos": `docker compose up` no lo levanta. Uso:
  #   docker compose --profile eventos up -d pubsub-emulator
  #   PUBSUB_EMULATOR_HOST=localhost:8086 infra/pubsub/emulator.sh
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: buenvivir-pubsub-emulator
    profiles: ["eventos"]
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8086 --project=ceibuenvivir
    ports:
      - "127.0.0.1:8086:8086"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - buenvivir-net

networks:
  buenvivir-net:
    driver: bridge
