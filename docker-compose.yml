services:
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - ./auth/.env
    ports:
      - "8082:8080"
      - "50051:50051"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
      - buenvivir-net

  education-service:
    build:
      context: ./education
      dockerfile: Dockerfile
    env_file:
      - ./education/.env
    ports:
      - "8210:8210"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
