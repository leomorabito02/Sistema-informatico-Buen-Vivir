services:
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - ./auth/.env
    ports:
      - "8082:8080"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
    - buenvivir-net

  education-service:
    build:
      context: ./education
      dockerfile: Dockerfile
    env_file:
      - ./education/.env
    ports:
      - "8210:8210"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1024m
    cpus: "1"
    networks:
    - buenvivir-net

  api-gateway:
    image: nginx:alpine
    container_name: buenvivir-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - education-service
    restart: on-failure
    networks:
      - buenvivir-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buenvivir-frontend
    ports:
      - "4200:8080"
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - buenvivir-net

networks:
  buenvivir-net:
    driver: bridge