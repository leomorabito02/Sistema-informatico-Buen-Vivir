          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Capture previous Cloud Run revision (for rollback)
        id: pre-deploy
        run: |
          SERVICE="dashboard-${{ needs.cd-setup.outputs.service_suffix }}"
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "prev_revision=$PREV" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREV:-none}"

      - name: Prepare Google credentials (base64)
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS_BASE64=$(echo -n "$FIREBASE_JSON" | base64 -w 0)" >> $GITHUB_ENV
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      # deploy-cloudrun separa env_vars por comas: las comas de la lista de
      # orígenes se escapan con \ para que llegue entera.
      - name: Escape CORS origins for deploy-cloudrun
        run: |
          ESCAPED=$(printf '%s' "$CORS_ALLOWED_ORIGINS" | sed 's/,/\\,/g')
          echo "CORS_ALLOWED_ORIGINS_ESCAPED=$ESCAPED" >> $GITHUB_ENV
        env:
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

      # El Dashboard valida el token por su cuenta (en Google Cloud el
      # gateway no pasa el rol) y llama a los demás servicios con un token
      # de identidad de Google (UPSTREAM_ID_TOKEN): la service account
      # necesita roles/run.invoker sobre auth, education, human-promotion y labor-integration.
      - name: Deploy Dashboard to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'dashboard-${{ needs.cd-setup.outputs.service_suffix }}'
          region: '${{ secrets.GCP_REGION }}'
          image: '${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/dashboard:${{ github.sha }}'
          flags: '--no-allow-unauthenticated --min-instances=0 --max-instances=3 --cpu=1 --cpu-boost --memory=256Mi --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}'
          env_vars: |-
            APP_ENV=${{ needs.cd-setup.outputs.app_env }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AUTH_SERVICE_URL=${{ needs.cd-auth.outputs.service_url }}
            EDUCATION_SERVICE_URL=${{ needs.cd-education.outputs.service_url }}
            HUMAN_PROMOTION_SERVICE_URL=${{ needs.cd-human-promotion.outputs.service_url }}
            LABOR_SERVICE_URL=${{ needs.cd-labor-integration.outputs.service_url }}
            UPSTREAM_ID_TOKEN=true
            REPORTES_BUCKET=ceibuenvivir-bucket
            CORS_ALLOWED_ORIGINS=${{ env.CORS_ALLOWED_ORIGINS_ESCAPED }}
            GOOGLE_APPLICATION_CREDENTIALS_BASE64=${{ env.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}

      - name: Ensure 100% traffic routed to latest Cloud Run revision
        run: |
          SERVICE="dashboard-${{ needs.cd-setup.outputs.service_suffix }}"
          gcloud run services update-traffic "$SERVICE" --region="${{ secrets.GCP_REGION }}" --to-latest --project="${{ secrets.GCP_PROJECT_ID }}"

  cd-cv-renderer:
    name: CD — CV Renderer (Cloud Run)
    runs-on: ubuntu-latest
    needs: [cd-setup]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
      prev_revision: ${{ steps.pre-deploy.outputs.prev_revision }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Capture previous Cloud Run revision (for rollback)
        id: pre-deploy
        run: |
          SERVICE="cv-renderer-${{ needs.cd-setup.outputs.service_suffix }}"
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "prev_revision=$PREV" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREV:-none}"

      - name: Deploy CV Renderer to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'cv-renderer-${{ needs.cd-setup.outputs.service_suffix }}'
          region: '${{ secrets.GCP_REGION }}'
          image: '${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/cv-renderer:${{ github.sha }}'
          # PORT es reservada en Cloud Run: el puerto se fija con --port y
          # Cloud Run se lo pasa al contenedor como PORT=5005.
          flags: '--port=5005 --no-allow-unauthenticated --min-instances=0 --max-instances=3 --cpu=1 --cpu-boost --memory=1Gi --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}'
          env_vars: |-
            NODE_ENV=production

      - name: Ensure 100% traffic routed to latest Cloud Run revision
        run: |
          SERVICE="cv-renderer-${{ needs.cd-setup.outputs.service_suffix }}"
          gcloud run services update-traffic "$SERVICE" --region="${{ secrets.GCP_REGION }}" --to-latest --project="${{ secrets.GCP_PROJECT_ID }}"

  cd-rxresume:
    name: CD — RxResume Service (Cloud Run)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-cv-renderer]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: ${{ needs.cd-setup.outputs.env_name == 'PROD' && 'production' || 'development' }}
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
      prev_revision: ${{ steps.pre-deploy.outputs.prev_revision }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Capture previous Cloud Run revision (for rollback)
        id: pre-deploy
        run: |
          SERVICE="rxresume-${{ needs.cd-setup.outputs.service_suffix }}"
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "prev_revision=$PREV" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREV:-none}"

      - name: Deploy RxResume to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'rxresume-${{ needs.cd-setup.outputs.service_suffix }}'
          region: '${{ secrets.GCP_REGION }}'
          image: '${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/rxresume:${{ github.sha }}'
          flags: '--no-allow-unauthenticated --min-instances=0 --max-instances=3 --cpu=1 --cpu-boost --memory=1Gi --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}'
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL_RXRESUME }}
            RENDERER_URL=${{ needs.cd-cv-renderer.outputs.service_url }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ vars.GCP_BUCKET_NAME || 'buenvivir-resumes-bucket' }}

      - name: Ensure 100% traffic routed to latest Cloud Run revision
        run: |
          SERVICE="rxresume-${{ needs.cd-setup.outputs.service_suffix }}"
          gcloud run services update-traffic "$SERVICE" --region="${{ secrets.GCP_REGION }}" --to-latest --project="${{ secrets.GCP_PROJECT_ID }}"

  cd-api-gateway:
    name: CD — API Gateway (Google Cloud)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth, cd-notifications, cd-education, cd-rxresume, cd-cv-renderer, cd-human-promotion, cd-labor-integration, cd-campaigns, cd-dashboard]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_url: ${{ steps.deploy-gateway.outputs.gateway_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve openapi.yaml (envsubst)
        working-directory: api-gateway
        run: |
          SUFFIX="${{ needs.cd-setup.outputs.service_suffix }}"
          AUTH_URL=$(gcloud run services describe "auth-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          EDU_URL=$(gcloud run services describe "education-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          if [ -z "$AUTH_URL" ] || [ -z "$EDU_URL" ]; then
            echo "::error::No se pudo resolver la URL de auth ($AUTH_URL) o education ($EDU_URL) en Cloud Run."
            exit 1
          fi
          export AUTH_SERVICE_URL="$AUTH_URL"
          export EDUCATION_SERVICE_URL="$EDU_URL"

          export RXRESUME_SERVICE_URL=$(gcloud run services describe "rxresume-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          export HUMAN_PROMOTION_SERVICE_URL=$(gcloud run services describe "human-promotion-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          export LABOR_SERVICE_URL=$(gcloud run services describe "labor-integration-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          export CAMPAIGNS_SERVICE_URL=$(gcloud run services describe "campaigns-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          export DASHBOARD_SERVICE_URL=$(gcloud run services describe "dashboard-$SUFFIX" --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')
          export FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          envsubst < openapi.yaml > openapi-resolved.yaml
          echo "openapi.yaml resolved for env: $SUFFIX (auth=$AUTH_URL, education=$EDU_URL, labor=$LABOR_SERVICE_URL)"


      - name: Create or update API Gateway config
        id: deploy-gateway
        working-directory: api-gateway
        run: |
          SUFFIX="${{ needs.cd-setup.outputs.service_suffix }}"
          API_ID="buenvivir-api-$SUFFIX"
          CONFIG_ID="config-${{ github.sha }}"
          REGION="${{ secrets.GCP_REGION }}"

          gcloud api-gateway apis create "$API_ID" \
            --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null || echo "API already exists."

          gcloud api-gateway api-configs create "$CONFIG_ID" \
            --api="$API_ID" \
            --openapi-spec=openapi-resolved.yaml \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --backend-auth-service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" 2>/dev/null || echo "API Config already exists."

          # Wait for config to be active before updating gateway
          STATE="CREATING"
          for i in $(seq 1 30); do
            STATE=$(gcloud api-gateway api-configs describe "$CONFIG_ID" --api="$API_ID" \
              --project="${{ secrets.GCP_PROJECT_ID }}" --format="value(state)" 2>/dev/null || echo "UNKNOWN")
            echo "Config state: $STATE (attempt $i/30)"
            if [ "$STATE" = "ACTIVE" ]; then
              break
            elif [ "$STATE" = "FAILED" ]; then
              echo "::error::API Config creation failed!"
              exit 1
            fi
            sleep 15
          done

          if [ "$STATE" != "ACTIVE" ]; then
            echo "::error::Timed out waiting for API Config $CONFIG_ID to become ACTIVE (state: $STATE)"
            exit 1
          fi

          EXISTING=$(gcloud api-gateway gateways describe "buenvivir-gateway-$SUFFIX" \
            --location="$REGION" --project="${{ secrets.GCP_PROJECT_ID }}" --format="value(name)" 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            n=0
            until [ "$n" -ge 3 ]
            do
              gcloud api-gateway gateways update "buenvivir-gateway-$SUFFIX" \
                --api="$API_ID" \
                --api-config="$CONFIG_ID" \
                --location="$REGION" \
                --project="${{ secrets.GCP_PROJECT_ID }}" && break
              n=$((n+1))
              echo "Gateway update failed, retrying in 20 seconds..."
              sleep 20
            done
            if [ "$n" -ge 3 ]; then echo "Failed to update API Gateway after 3 attempts."; exit 1; fi
          else
            n=0
            until [ "$n" -ge 3 ]
            do
              gcloud api-gateway gateways create "buenvivir-gateway-$SUFFIX" \
                --api="$API_ID" \
                --api-config="$CONFIG_ID" \
                --location="$REGION" \
                --project="${{ secrets.GCP_PROJECT_ID }}" && break
              n=$((n+1))
              echo "Gateway create failed, retrying in 20 seconds..."
              sleep 20
            done
            if [ "$n" -ge 3 ]; then echo "Failed to create API Gateway after 3 attempts."; exit 1; fi
          fi

          echo "API Gateway deployed: buenvivir-gateway-$SUFFIX"
          HOSTNAME=$(gcloud api-gateway gateways describe "buenvivir-gateway-$SUFFIX" \
            --location="$REGION" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(defaultHostname)")
          if [ -z "$HOSTNAME" ]; then
            echo "::error::Failed to retrieve gateway hostname."
            exit 1
          fi
          echo "gateway_url=https://$HOSTNAME" >> $GITHUB_OUTPUT
          echo "Gateway URL: https://$HOSTNAME"

  cd-frontend:
    name: CD — Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-api-gateway]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15

    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ./dist-angular

      - name: Inject API URL into env.js
        run: |
          export API_URL="${{ needs.cd-api-gateway.outputs.gateway_url }}"
          if [ -z "$API_URL" ]; then
            echo "::error::gateway_url output is empty. Cannot inject API_URL."
            exit 1
          fi
          envsubst < ./dist-angular/assets/env.template.js > ./dist-angular/assets/env.js
          echo "Injected API_URL: $API_URL into env.js"
          cat ./dist-angular/assets/env.js

      - name: Deploy to Cloudflare Pages
        id: deploy-cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy ./dist-angular
            --project-name=${{ secrets.CLOUDFLARE_PROJECT }}
            --branch=${{ github.ref_name }}

  cd-worker:
    name: CD — Cloudflare Worker (Impact Stats)
    runs-on: ubuntu-latest
    needs: [cd-setup]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # cloudflare-worker tiene pnpm-lock.yaml, así que wrangler-action
      # instala wrangler con pnpm: sin este paso no lo encuentra.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          environment: ${{ needs.cd-setup.outputs.env_name == 'PROD' && 'production' || 'staging' }}
          secrets: |
            WORKER_SYNC_TOKEN
        env:
          WORKER_SYNC_TOKEN: ${{ secrets.WORKER_SYNC_TOKEN }}

  cd-smoke:
    name: CD — Smoke Tests
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth, cd-notifications, cd-education, cd-rxresume, cd-cv-renderer, cd-human-promotion, cd-labor-integration, cd-campaigns, cd-dashboard, cd-api-gateway, cd-frontend, cd-worker]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate GCP (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-auth.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Notifications Service
        id: auth_notif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-notifications.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Education Service
        id: auth_edu
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-education.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Human Promotion Service
        id: auth_hp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-human-promotion.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Labor Integration Service
        id: auth_labor
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-labor-integration.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Campaigns Service
        id: auth_campaigns
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-campaigns.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for Dashboard Service
        id: auth_dashboard
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-dashboard.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for RxResume Service
        id: auth_rxresume
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-rxresume.outputs.service_url }}
          id_token_include_email: true

      - name: Mint ID token for CV Renderer Service
        id: auth_renderer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-cv-renderer.outputs.service_url }}
          id_token_include_email: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Smoke test — Dashboard Service (/health y protección)
        run: |
          DSH_URL="${{ needs.cd-dashboard.outputs.service_url }}"
          TOKEN="${{ steps.auth_dashboard.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "X-Serverless-Authorization: Bearer $TOKEN" "$DSH_URL/health" | grep -q '"status":"UP"' \
            || { echo "::error::Dashboard /health no respondió UP"; exit 1; }
          # Sin sesión de usuario, los indicadores tienen que responder 401.
          STATUS=$(curl --retry 3 --retry-delay 5 --silent --output /dev/null --write-out "%{http_code}" --max-time 15 \
            -H "X-Serverless-Authorization: Bearer $TOKEN" "$DSH_URL/api/v1/dashboard/resumen?desde=2026-01-01&hasta=2026-01-31")
          [ "$STATUS" = "401" ] || { echo "::error::Dashboard sin sesión respondió $STATUS (se esperaba 401)"; exit 1; }
          echo "Dashboard health: OK"

      - name: Smoke test — Notifications Service (/health)
        run: |
          NTF_URL="${{ needs.cd-notifications.outputs.service_url }}"
          TOKEN="${{ steps.auth_notif.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$NTF_URL/health"
          echo "Notifications health: OK"

      - name: Smoke test — Human Promotion Service (/health)
        run: |
          HP_URL="${{ needs.cd-human-promotion.outputs.service_url }}"
          TOKEN="${{ steps.auth_hp.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$HP_URL/health"
          echo "Human Promotion health: OK"

      - name: Smoke test — Labor Integration Service (/health)
        run: |
          LBR_URL="${{ needs.cd-labor-integration.outputs.service_url }}"
          TOKEN="${{ steps.auth_labor.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$LBR_URL/health" | grep -q '"status":"UP"' \
            || { echo "::error::Labor Integration /health no respondió UP"; exit 1; }
          echo "Labor Integration health: OK"

      - name: Smoke test — RxResume & CV Renderer Services (/health)
        run: |
          RX_URL="${{ needs.cd-rxresume.outputs.service_url }}"
          RX_TOKEN="${{ steps.auth_rxresume.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $RX_TOKEN" "$RX_URL/health"
          RND_URL="${{ needs.cd-cv-renderer.outputs.service_url }}"
          RND_TOKEN="${{ steps.auth_renderer.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $RND_TOKEN" "$RND_URL/health"
          echo "RxResume & CV Renderer health: OK"

      - name: Smoke test — Campaigns Service (/health y listado público)
        run: |
          CMP_URL="${{ needs.cd-campaigns.outputs.service_url }}"
          TOKEN="${{ steps.auth_campaigns.outputs.id_token }}"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$CMP_URL/health" | grep -q '"status":"UP"' \
            || { echo "::error::Campaigns /health no respondió UP"; exit 1; }
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$CMP_URL/api/v1/campaigns/publicas" > /dev/null \
            || { echo "::error::Campaigns listado público falló (¿Firestore?)"; exit 1; }
          echo "Campaigns health: OK"

      - name: Smoke test — Education Service (/api/salud)
        run: |
          EDU_URL="${{ needs.cd-education.outputs.service_url }}"
          echo "Testing Education health: $EDU_URL/api/salud"
          BODY=$(curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${{ steps.auth_edu.outputs.id_token }}" "$EDU_URL/api/salud")
          echo "$BODY"
          echo "$BODY" | grep -q '"status"' || { echo "::error::Education /api/salud sin campo status"; exit 1; }
          EXPECTED_CF="${{ needs.cd-setup.outputs.contentful_environment }}"
          echo "$BODY" | grep -q "\"contentfulEnvironment\":\"$EXPECTED_CF\"" || {
            echo "::error::Education apuntando a un Environment de Contentful distinto del esperado ($EXPECTED_CF)"; exit 1; }
          echo "Education health: OK"

      - name: Smoke test — Auth Service (/health)
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          echo "Testing Auth health: $AUTH_URL/health"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 -H "Authorization: Bearer ${{ steps.auth.outputs.id_token }}" "$AUTH_URL/health"
          echo "Auth health: OK"

      - name: Smoke test — Auth login endpoint (expect 400/422/401)
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          STATUS=$(curl --retry 3 --retry-delay 5 --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 15 -X POST "$AUTH_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.id_token }}" \
            -d '{"email":"smoke@test.com","password":"wrong"}')
          echo "Login endpoint status: $STATUS"
          if [ "$STATUS" != "400" ] && [ "$STATUS" != "401" ] && [ "$STATUS" != "422" ]; then
            echo "::error::Auth login endpoint returned unexpected status $STATUS"
            exit 1
          fi
          echo "Auth login endpoint: OK"

      - name: Smoke test — Frontend (Cloudflare)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            FRONTEND_URL="https://${{ secrets.CLOUDFLARE_PROJECT }}.pages.dev"
          else
            FRONTEND_URL="https://${{ github.ref_name }}.${{ secrets.CLOUDFLARE_PROJECT }}.pages.dev"
          fi
          echo "Testing Frontend URL: $FRONTEND_URL"
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --max-time 15 "$FRONTEND_URL"
          echo "Frontend health: OK"

  cd-dast-zap:
    name: CD — DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-smoke, cd-auth, cd-notifications, cd-education, cd-rxresume, cd-cv-renderer, cd-human-promotion, cd-labor-integration, cd-campaigns, cd-dashboard, cd-api-gateway]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve OpenAPI spec for ZAP
        run: |
          export AUTH_SERVICE_URL="${{ needs.cd-auth.outputs.service_url }}"
          export EDUCATION_SERVICE_URL="${{ needs.cd-education.outputs.service_url }}"
          export RXRESUME_SERVICE_URL="${{ needs.cd-rxresume.outputs.service_url }}"
          export HUMAN_PROMOTION_SERVICE_URL="${{ needs.cd-human-promotion.outputs.service_url }}"
          export LABOR_SERVICE_URL="${{ needs.cd-labor-integration.outputs.service_url }}"
          export CAMPAIGNS_SERVICE_URL="${{ needs.cd-campaigns.outputs.service_url }}"
          export DASHBOARD_SERVICE_URL="${{ needs.cd-dashboard.outputs.service_url }}"
          export FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          envsubst < api-gateway/openapi.yaml > api-gateway/openapi-resolved.yaml

      - name: ZAP API Scan — API Gateway
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'api-gateway/openapi-resolved.yaml'
          format: openapi
          cmd_options: '-O ${{ needs.cd-api-gateway.outputs.gateway_url }}'
          rules_file_name: 'auth/zap.conf'
          fail_action: ${{ needs.cd-setup.outputs.env_name == 'TESTING' && 'true' || 'false' }}
          artifact_name: zap-auth-report
          allow_issue_writing: false

  cd-load-k6:
    name: CD — Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-smoke, cd-auth]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: needs.cd-setup.outputs.env_name == 'TESTING'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mint ID token for Auth Service (k6)
        id: auth_k6
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.cd-auth.outputs.service_url }}
          id_token_include_email: true

      - name: Run k6 load tests
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          echo "Running k6 against: $AUTH_URL"
          docker run --rm -i grafana/k6 run \
            -e BASE_URL="$AUTH_URL" \
            -e ID_TOKEN="${{ steps.auth_k6.outputs.id_token }}" \
            - < auth/load_test.js

  cd-rollback:
    name: CD — Rollback (auto)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth, cd-notifications, cd-education, cd-rxresume, cd-cv-renderer, cd-human-promotion, cd-labor-integration, cd-campaigns, cd-dashboard, cd-frontend, cd-smoke, cd-dast-zap, cd-load-k6]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: always() && (needs.cd-smoke.result == 'failure' || needs.cd-dast-zap.result == 'failure' || needs.cd-load-k6.result == 'failure')

    steps:
      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Rollback Cloud Run services (previous revision)
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          SUFFIX="${{ needs.cd-setup.outputs.service_suffix }}"
          rollback_service() {
            local SVC="$1"
            local PREV="$2"
            if [ -n "$PREV" ]; then
              echo "Rolling back $SVC to revision: $PREV"
              gcloud run services update-traffic "$SVC" \
                --region="$REGION" \
                --project="${{ secrets.GCP_PROJECT_ID }}" \
                --to-revisions "$PREV=100"
            else
              echo "::warning::No previous revision found for $SVC. Manual intervention required."
            fi
          }
          rollback_service "auth-$SUFFIX" "${{ needs.cd-auth.outputs.prev_revision }}"
          rollback_service "notifications-$SUFFIX" "${{ needs.cd-notifications.outputs.prev_revision }}"
          rollback_service "education-$SUFFIX" "${{ needs.cd-education.outputs.prev_revision }}"
          rollback_service "human-promotion-$SUFFIX" "${{ needs.cd-human-promotion.outputs.prev_revision }}"
          rollback_service "labor-integration-$SUFFIX" "${{ needs.cd-labor-integration.outputs.prev_revision }}"
          rollback_service "campaigns-$SUFFIX" "${{ needs.cd-campaigns.outputs.prev_revision }}"
          rollback_service "dashboard-$SUFFIX" "${{ needs.cd-dashboard.outputs.prev_revision }}"
          rollback_service "rxresume-$SUFFIX" "${{ needs.cd-rxresume.outputs.prev_revision }}"
          rollback_service "cv-renderer-$SUFFIX" "${{ needs.cd-cv-renderer.outputs.prev_revision }}"

      - name: Rollback Frontend (Cloudflare Pages)
        run: |
          echo "::error::Smoke tests failed. Cloudflare deployment may need manual rollback."
          echo "Use: wrangler pages deployment rollback --project-name=${{ secrets.CLOUDFLARE_PROJECT }}"
        continue-on-error: true

      - name: Mark CD as failed
        run: |
          echo "::error::Rollback executed. CD failed for SHA ${{ github.sha }}."
          exit 1
