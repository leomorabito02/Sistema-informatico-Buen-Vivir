      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: notifications/go.sum

      - name: Download Go dependencies
        working-directory: notifications
        run: go mod download

      - name: Go vet
        working-directory: notifications
        run: go vet ./...

      - name: Run Unit Tests (notifications)
        working-directory: notifications
        run: go test -v -race -cover ./...

      - name: Go Security Scan (gosec)
        working-directory: notifications
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: notifications
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build (notifications)
        run: docker build -t notifications:${{ github.sha }} -f notifications/Dockerfile ./notifications

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'notifications:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push notifications image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/notifications:${{ github.sha }}"
          docker tag notifications:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  ci-dashboard:
    name: CI — Dashboard Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    # El repositorio del historial de reportes se prueba contra el
    # emulador de Firestore (sin él, esa prueba se saltea).
    services:
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: dashboard/go.sum

      - name: Download Go modules
        working-directory: dashboard
        run: go mod download

      - name: Go vet
        working-directory: dashboard
        run: go vet ./...

      - name: Unit + integration tests + coverage
        working-directory: dashboard
        run: |
          go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage threshold (70%)
        working-directory: dashboard
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "### Dashboard Service Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the required 70% threshold."
            exit 1
          fi

      - name: Go Security Scan (gosec)
        working-directory: dashboard
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: dashboard
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build (dashboard)
        run: docker build -t dashboard:${{ github.sha }} -f dashboard/Dockerfile ./dashboard

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'dashboard:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push dashboard image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/dashboard:${{ github.sha }}"
          docker tag dashboard:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  ci-labor-integration:
    name: CI — Labor Integration Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    services:
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390

    steps:
      - name: Checkout repository
