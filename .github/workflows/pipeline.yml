        with:
          image-ref: 'labor-integration:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push labor-integration image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/labor-integration:${{ github.sha }}"
          docker tag labor-integration:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  ci-cv-renderer:
    name: CI — CV Renderer (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # reactive-resume exige node >= 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: rxresume/reactive-resume/package.json
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test cv-engine
        working-directory: frontend/cv-engine
        run: pnpm test

      - name: Docker build (cv-renderer)
        run: docker build -t cv-renderer:${{ github.sha }} -f frontend/cv-engine/Dockerfile ./frontend

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push cv-renderer image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/cv-renderer:${{ github.sha }}"
          docker tag cv-renderer:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  ci-api-gateway:
    name: CI — API Gateway (OpenAPI spec)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for swagger-cli)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli

      - name: Substitute env vars in openapi.yaml
        working-directory: api-gateway
        run: |
          export GATEWAY_HOST="validate.example.com"
          export AUTH_SERVICE_URL="https://auth.example.com"
          export EDUCATION_SERVICE_URL="https://education.example.com"
          export RXRESUME_SERVICE_URL="https://rxresume.example.com"
          export HUMAN_PROMOTION_SERVICE_URL="https://human-promotion.example.com"
          export CAMPAIGNS_SERVICE_URL="https://campaigns.example.com"
          export DASHBOARD_SERVICE_URL="https://dashboard.example.com"
          export LABOR_SERVICE_URL="https://labor-integration.example.com"
          export FIREBASE_PROJECT_ID="validate-project"
          envsubst < openapi.yaml > openapi-resolved.yaml

      - name: Validate OpenAPI spec (swagger-cli)
        working-directory: api-gateway
        run: swagger-cli validate openapi-resolved.yaml

      - name: Verify OWASP security headers in nginx.conf
        working-directory: api-gateway
        run: |
          echo "Verifying required OWASP headers in nginx.conf..."
          grep -q "X-Content-Type-Options" nginx.conf  || { echo "::error::Missing X-Content-Type-Options header"; exit 1; }
          grep -q "X-Frame-Options" nginx.conf          || { echo "::error::Missing X-Frame-Options header"; exit 1; }
          grep -q "Strict-Transport-Security" nginx.conf || { echo "::error::Missing HSTS header"; exit 1; }
          grep -q "Referrer-Policy" nginx.conf          || { echo "::error::Missing Referrer-Policy header"; exit 1; }
          echo "All required OWASP headers present."

  ci-gate:
    name: CI — Gate (Verificación general)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-secrets, ci-frontend, ci-pkg, ci-auth, ci-education, ci-rxresume, ci-human-promotion, ci-campaigns, ci-notifications, ci-dashboard, ci-labor-integration, ci-cv-renderer, ci-api-gateway]
    if: always()

    steps:
      - name: Fail if any CI job failed
        run: |
          if [ "${{ needs.ci-secrets.result }}" != "success" ]; then
            echo "::error::ci-secrets failed."
            exit 1
          fi
          if [ "${{ needs.ci-frontend.result }}" != "success" ]; then
            echo "::error::ci-frontend failed."
            exit 1
          fi
          if [ "${{ needs.ci-pkg.result }}" != "success" ]; then
            echo "::error::ci-pkg failed."
            exit 1
          fi
          if [ "${{ needs.ci-auth.result }}" != "success" ]; then
            echo "::error::ci-auth failed."
            exit 1
          fi
          if [ "${{ needs.ci-education.result }}" != "success" ]; then
            echo "::error::ci-education failed."
            exit 1
          fi
          if [ "${{ needs.ci-api-gateway.result }}" != "success" ]; then
            echo "::error::ci-api-gateway failed."
            exit 1
          fi
          if [ "${{ needs.ci-cv-renderer.result }}" != "success" ]; then
            echo "::error::ci-cv-renderer failed."
            exit 1
          fi
          if [ "${{ needs.ci-rxresume.result }}" != "success" ]; then
            echo "::error::ci-rxresume failed."
            exit 1
          fi
          if [ "${{ needs.ci-human-promotion.result }}" != "success" ]; then
            echo "::error::ci-human-promotion failed."
            exit 1
          fi
          if [ "${{ needs.ci-campaigns.result }}" != "success" ]; then
            echo "::error::ci-campaigns failed."
            exit 1
          fi
          if [ "${{ needs.ci-notifications.result }}" != "success" ]; then
            echo "::error::ci-notifications failed."
            exit 1
          fi
          if [ "${{ needs.ci-dashboard.result }}" != "success" ]; then
            echo "::error::ci-dashboard failed."
            exit 1
          fi
          if [ "${{ needs.ci-labor-integration.result }}" != "success" ]; then
            echo "::error::ci-labor-integration failed."
            exit 1
          fi
          echo "All CI jobs passed. Gate cleared."

# ============================================================================
# STAGE 2: MUTATION TESTING (DISABLED / COMMENTED)
# ============================================================================
  mutation-frontend:
    name: Mutation — Frontend (Stryker)
    runs-on: ubuntu-latest
    needs: [ci-frontend]
    if: false # (github.event_name == 'push' && github.ref == 'refs/heads/testing') || (github.event_name == 'pull_request' && github.base_ref == 'refs/heads/main')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Stryker mutation tests
        working-directory: frontend
        run: |
          npx stryker run > stryker_output.txt || true
          cat stryker_output.txt
          echo "### Frontend Mutation Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -n 20 stryker_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Stryker mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ github.sha }}
          path: frontend/reports/mutation/
          retention-days: 14

