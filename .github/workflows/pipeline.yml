# ============================================================================
# STAGE 3: CD (Continuous Deployment)
# Corre SOLO si el CI-Gate fue exitoso Y es un push a 'testing' o 'main'.
# ============================================================================

  cd-setup:
    name: CD — Setup & Verify
    runs-on: ubuntu-latest
    needs: [ci-gate]
    if: needs.ci-gate.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      service_suffix: ${{ steps.env.outputs.service_suffix }}
      app_env: ${{ steps.env.outputs.app_env }}
      contentful_environment: ${{ steps.env.outputs.contentful_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=PROD"                        >> $GITHUB_OUTPUT
            echo "service_suffix=prod"                  >> $GITHUB_OUTPUT
            # education: APP_ENV/CONTENTFUL_ENVIRONMENT tienen que ser
            # coherentes o el servicio se niega a arrancar
            # (validateEnvironmentSafety en internal/config/config.go).
            echo "app_env=production"                   >> $GITHUB_OUTPUT
            echo "contentful_environment=master"        >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/testing" ]; then
            echo "env_name=TESTING"                     >> $GITHUB_OUTPUT
            echo "service_suffix=testing"               >> $GITHUB_OUTPUT
            echo "app_env=testing"                      >> $GITHUB_OUTPUT
            echo "contentful_environment=testing"       >> $GITHUB_OUTPUT
          else
            echo "::error::Branch '${{ github.ref }}' no autorizada para CD."
            exit 1
          fi

      - name: Verify Angular artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ./dist-angular

      - name: Fail if Angular artifact missing
        run: |
          if [ ! -d "./dist-angular" ] || [ -z "$(ls -A ./dist-angular)" ]; then
            echo "::error::Angular artifact for SHA ${{ github.sha }} not found. CD requires a passing CI build."
