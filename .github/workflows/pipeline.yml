        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/campaigns:${{ github.sha }}"
          docker tag campaigns:${{ github.sha }} "$IMAGE_URI"
