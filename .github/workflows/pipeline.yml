        working-directory: campaigns
        run: go vet ./...

      # -coverpkg: los handlers y middlewares se prueban desde el paquete
      # routes; sin esto la cobertura de cada paquete sale artificialmente baja.
      - name: Unit + integration tests + coverage
        working-directory: campaigns
        run: |
          go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

