name: Unified CI/CD & Mutation Pipeline

on:
  push:
    branches-ignore:
      - 'Calidad'
  pull_request:
    branches-ignore:
      - 'Calidad'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

# ============================================================================
# STAGE 1: CI (Continuous Integration - Validaciones y pruebas básicas)
# Corre en CUALQUIER push, PR o ejecución manual
# ============================================================================
jobs:
  ci-secrets:
    name: CI — Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-frontend:
    name: CI — Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # El front importa @buenvivir/cv-engine/browser, que se exporta desde
      # cv-engine/dist (no versionado): sin este paso no compilan ni los
      # tests ni el build.
      - name: Build cv-engine
        working-directory: frontend
        run: pnpm --filter @buenvivir/cv-engine build

      - name: ESLint
        working-directory: frontend
        run: pnpm exec eslint . --ext .ts,.html

      - name: Prettier check
        working-directory: frontend
        run: pnpm run format:check

      - name: Unit tests (Karma/Jasmine) + coverage
        working-directory: frontend
        run: |
          set +e
          npx ng test --watch=false --browsers=ChromeHeadless --code-coverage > test_output.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat test_output.txt
          echo "### Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -i -E "Executed|TOTAL|SUCCESS|FAILED" test_output.txt >> $GITHUB_STEP_SUMMARY || tail -n 10 test_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_EXIT" -ne 0 ] || grep -q "FAILED" test_output.txt; then exit 1; fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          retention-days: 7

      - name: SAST — Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true

      - name: SCA — pnpm audit (block HIGH/CRITICAL)
        working-directory: frontend
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported unpatched transitive vulnerabilities in devDependencies (image-size)."

      - name: Build Angular (production)
        working-directory: frontend
        run: pnpm exec ng build --configuration production

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: frontend/dist/frontend-buen-vivir/browser
          retention-days: 7

  ci-pkg:
    name: CI — Shared Packages (pkg)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: pkg/go.sum

      - name: Download Go modules
        working-directory: pkg
        run: go mod download

      - name: Go vet
        working-directory: pkg
        run: go vet ./...

      - name: Unit tests
        working-directory: pkg
        run: go test -v -race -coverprofile=coverage.out ./...

  ci-auth:
    name: CI — Auth Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: auth/go.sum

      - name: Download Go dependencies
        working-directory: auth
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: auth
          args: --timeout=5m

      - name: Unit + integration tests + coverage
        working-directory: auth
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          # El código gRPC generado por protoc (api/proto) no se mide.
          grep -v '/api/proto/' coverage.out > coverage.filtered.out
          mv coverage.filtered.out coverage.out
          go tool cover -func=coverage.out

      - name: Enforce coverage threshold (75%)
        working-directory: auth
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          echo "### Auth Service Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the required 75% threshold."
            exit 1
          fi

      - name: Upload auth coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-${{ github.sha }}
          path: auth/coverage.out
          retention-days: 7

      - name: Contract tests — Auth provider (Pact)
        working-directory: auth
        run: go test -v ./tests/contract/...

      - name: SAST — gosec
        working-directory: auth
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: auth/gosec-results.sarif
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: auth
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build (auth)
        run: docker build -t auth:${{ github.sha }} -f auth/Dockerfile ./auth

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'auth:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate GCP (Workload Identity)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/auth:${{ github.sha }}"
          docker tag auth:${{ github.sha }} "$IMAGE_URI"
          n=0
          until [ "$n" -ge 3 ]
          do
             docker push "$IMAGE_URI" && break
             n=$((n+1))
             echo "Push failed, retrying in 10 seconds..."
             sleep 10
          done
          if [ "$n" -ge 3 ]; then echo "Failed to push image after 3 attempts."; exit 1; fi

  ci-education:
    name: CI — Education Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    # education-service no tiene base de datos relacional propia (el
    # catálogo vive en Contentful, un SaaS externo), pero sí usa Firestore
    # para actividades/asistencias/inscripciones. Los tests de esos
    # repositories corren contra el emulador oficial de Firestore, no
    # contra un proyecto real de GCP — mismo criterio que auth con su
    # Postgres. Ver education/TESTS.md.
    services:
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: education/go.sum

      - name: Download Go dependencies
        working-directory: education
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: education
          args: --timeout=5m

      - name: Wait for Firestore emulator
        run: |
          for i in $(seq 1 30); do
            if curl -s "http://localhost:8390/" >/dev/null 2>&1; then
              echo "Firestore emulator ready"; exit 0
            fi
            echo "waiting for Firestore emulator ($i/30)..."; sleep 2
          done
          echo "::error::Firestore emulator did not become ready"; exit 1

      - name: Unit + integration tests + coverage
        working-directory: education
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Enforce coverage threshold (70%)
        working-directory: education
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          echo "### Education Service Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the required 70% threshold."
            exit 1
          fi

      - name: Upload education coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-coverage-${{ github.sha }}
          path: education/coverage.out
          retention-days: 7

      - name: Contract tests — Education provider (Pact)
        working-directory: education
        run: go test -v ./tests/contract/...

      - name: SAST — gosec
        working-directory: education
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -fmt=sarif -out=gosec-results.sarif ./... || true

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: education/gosec-results.sarif
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: education
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build (education)
        run: docker build -t education:${{ github.sha }} -f education/Dockerfile ./education

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'education:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate GCP (Workload Identity)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/education:${{ github.sha }}"
          docker tag education:${{ github.sha }} "$IMAGE_URI"
          n=0
          until [ "$n" -ge 3 ]
          do
             docker push "$IMAGE_URI" && break
             n=$((n+1))
             echo "Push failed, retrying in 10 seconds..."
             sleep 10
          done
          if [ "$n" -ge 3 ]; then echo "Failed to push image after 3 attempts."; exit 1; fi


  ci-rxresume:
    name: CI — RxResume Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rxresume/go.sum

      - name: Download Go modules
        working-directory: rxresume
        run: go mod download

      - name: Go vet
        working-directory: rxresume
        run: go vet ./...

      - name: Run Go Unit Tests
        working-directory: rxresume
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Go Security Scan (gosec)
        working-directory: rxresume
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: rxresume
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build (rxresume)
        run: docker build -t rxresume:${{ github.sha }} -f rxresume/Dockerfile ./rxresume

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'rxresume:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push rxresume image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/rxresume:${{ github.sha }}"
          docker tag rxresume:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

  ci-human-promotion:
    name: CI — Human Promotion Service (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read

    # Los repositorios (fichas, hitos, línea de tiempo, indicadores) se
    # prueban contra el emulador de Firestore; sin él, esas pruebas se
    # saltean y la cobertura queda baja.
    services:
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390

    steps:
      - name: Checkout repository
