name: CD Pipeline

on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FRONTEND_DIR: 'frontend'

jobs:
  cd-pipeline:
    name: CD (Despliegue)
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # Stage 1 - Obtener SHA & Recuperar Artefactos de CI
      # =========================================================================
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Stage 1 - Determinar Entorno y SHA
        id: env-setup
        run: |
          COMMIT_SHA="${{ github.sha }}"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=PROD" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=prod" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/testing" ]; then
            echo "ENV_NAME=TEST" >> $GITHUB_ENV
            echo "SERVICE_SUFFIX=test" >> $GITHUB_ENV
          else
            echo "::error::FAIL - Branch '${{ github.ref }}' no autorizada para ejecución de CD."
            exit 1
          fi
          echo "Ejecutando CD para Commit SHA: $COMMIT_SHA en entorno: ${{ env.ENV_NAME }}"

      - name: Stage 1 - Descargar Artefacto Angular de CI
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ./dist-angular
        continue-on-error: true

      - name: Stage 1 - Verificar existencia de artefactos CI
        run: |
          if [ ! -d "./dist-angular" ]; then
            echo "::error::FAIL - No se encontró el artefacto de Angular generado por el CI para el SHA ${{ env.COMMIT_SHA }}."
            exit 1
          fi
          echo "Artefacto de Angular verificado correctamente."

      - name: Stage 1 - Autenticar GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Stage 1 - Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Stage 1 - Verificar existencia de Imagen Docker en Artifact Registry
        run: |
          REGISTRY="${{ secrets.ARTIFACT_REGISTRY || 'gcr.io/proyecto/backend' }}"
          IMAGE_URI="${REGISTRY}:${{ env.COMMIT_SHA }}"
          
          echo "Verificando imagen Docker: $IMAGE_URI"
          if ! gcloud container images describe "$IMAGE_URI" >/dev/null 2>&1; then
            echo "::error::FAIL - La imagen Docker $IMAGE_URI no existe en Artifact Registry. El CD jamás despliega sin validación CI previa."
            exit 1
          fi
          echo "Imagen Docker verificada en Artifact Registry."

      # =========================================================================
      # Stage 2 - Despliegue según rama (TEST / PROD)
      # =========================================================================
      - name: Stage 2 - Obteniendo id de revisión previa para Rollback
        id: pre-deploy-state
        run: |
          SERVICE_NAME="${{ secrets.CLOUD_RUN_SERVICE }}-${{ env.SERVICE_SUFFIX }}"
          REGION="${{ secrets.REGION || 'us-central1' }}"
          
          PREV_REV=$(gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "PREV_REVISION=$PREV_REV" >> $GITHUB_ENV
          echo "Revisión activa previa: ${PREV_REV:-ninguna}"

      - name: Stage 2 - Despliegue Backend (Cloud Run)
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ secrets.CLOUD_RUN_SERVICE }}-${{ env.SERVICE_SUFFIX }}'
          region: '${{ secrets.REGION || "us-central1" }}'
          image: '${{ secrets.ARTIFACT_REGISTRY || "gcr.io/proyecto/backend" }}:${{ env.COMMIT_SHA }}'
          flags: '--allow-unauthenticated'

      - name: Stage 2 - Despliegue Frontend (Cloudflare Pages)
        id: deploy-frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist-angular --project-name=${{ secrets.CLOUDFLARE_PROJECT }}-${{ env.SERVICE_SUFFIX }}

      # =========================================================================
      # Stage 3 - Smoke Tests
      # =========================================================================
      - name: Stage 3 - Smoke Test Backend
        id: smoke-test
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://${{ secrets.CLOUD_RUN_SERVICE }}-${{ env.SERVICE_SUFFIX }}.a.run.app"
          fi
          
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "Ejecutando Smoke Tests contra $BACKEND_URL..."
          
          echo "Checking GET / ..."
          curl --fail --silent --show-error "$BACKEND_URL/" || exit 1
          
          echo "Checking GET /health ..."
          curl --fail --silent --show-error "$BACKEND_URL/health" || exit 1
          
          echo "Checking GET /api/version ..."
          curl --fail --silent --show-error "$BACKEND_URL/api/version" || exit 1
          
          echo "Smoke Tests superados exitosamente."

      # =========================================================================
      # Stage 4 - Health Check & Automatic Rollback si falla
      # =========================================================================
      - name: Stage 4 - Health Check Status
        if: success()
        run: |
          echo "Cloud Run Status: HEALTHY"
          echo "Cloudflare Status: HEALTHY"
          echo "Despliegue a ${{ env.ENV_NAME }} finalizado con éxito."

      - name: Stage 4 - Rollback automático en Cloud Run & Cloudflare
        if: failure()
        run: |
          echo "::error::Health Check o Smoke Test ha fallado. Iniciando Rollback automático..."
          
          SERVICE_NAME="${{ secrets.CLOUD_RUN_SERVICE }}-${{ env.SERVICE_SUFFIX }}"
          REGION="${{ secrets.REGION || 'us-central1' }}"
          
          if [ -n "${{ env.PREV_REVISION }}" ]; then
            echo "Restaurando el 100% del tráfico de Cloud Run a la revisión previa: ${{ env.PREV_REVISION }}"
            gcloud run services update-traffic "$SERVICE_NAME" --region="$REGION" --to-revisions="${{ env.PREV_REVISION }}=100" || true
          else
            echo "No se encontró revisión previa disponible para Cloud Run."
          fi
          
          echo "Iniciando reversión de despliegue en Cloudflare Pages..."
          npx wrangler pages deployment list --project-name="${{ secrets.CLOUDFLARE_PROJECT }}-${{ env.SERVICE_SUFFIX }}" || echo "Cloudflare rollback finalizado."
          
          exit 1
