name: CD Pipeline

on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# ============================================================================
# JOB: cd-setup
# Determines environment context and verifies CI artifacts exist.
# ============================================================================
jobs:
  cd-setup:
    name: CD — Setup & Verify
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      service_suffix: ${{ steps.env.outputs.service_suffix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=PROD"       >> $GITHUB_OUTPUT
            echo "service_suffix=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/testing" ]; then
            echo "env_name=TESTING"    >> $GITHUB_OUTPUT
            echo "service_suffix=testing" >> $GITHUB_OUTPUT
          else
            echo "::error::Branch '${{ github.ref }}' no autorizada para CD."
            exit 1
          fi

      - name: Verify Angular artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ./dist-angular

      - name: Fail if Angular artifact missing
        run: |
          if [ ! -d "./dist-angular" ] || [ -z "$(ls -A ./dist-angular)" ]; then
            echo "::error::Angular artifact for SHA ${{ github.sha }} not found. CD requires a passing CI build."
            exit 1
          fi
          echo "Angular artifact verified."

      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify auth image in Artifact Registry
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_REPO }}/auth:${{ github.sha }}"
          echo "Verifying image: $IMAGE_URI"
          if ! gcloud artifacts docker images describe "$IMAGE_URI" > /dev/null 2>&1; then
            echo "::error::Image $IMAGE_URI not found in Artifact Registry. CD requires image built by CI."
            exit 1
          fi
          echo "Image verified."

# ============================================================================
# JOB: cd-auth
# Deploy Auth Service to Cloud Run.
# ============================================================================
  cd-auth:
    name: CD — Auth Service (Cloud Run)
    runs-on: ubuntu-latest
    needs: [cd-setup]
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Capture previous Cloud Run revision (for rollback)
        id: pre-deploy
        run: |
          SERVICE="${{ secrets.CLOUD_RUN_SERVICE_AUTH }}-${{ needs.cd-setup.outputs.service_suffix }}"
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "prev_revision=$PREV" >> $GITHUB_OUTPUT
          echo "Previous revision: ${PREV:-none}"

      - name: Deploy Auth to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ secrets.CLOUD_RUN_SERVICE_AUTH }}-${{ needs.cd-setup.outputs.service_suffix }}'
          region: '${{ secrets.GCP_REGION }}'
          image: '${{ secrets.ARTIFACT_REGISTRY_REPO }}/auth:${{ github.sha }}'
          flags: '--allow-unauthenticated'

      - name: Save previous revision for rollback
        run: echo "PREV_AUTH_REVISION=${{ steps.pre-deploy.outputs.prev_revision }}" >> $GITHUB_ENV

# ============================================================================
# JOB: cd-api-gateway
# Deploy Google Cloud API Gateway with resolved openapi.yaml.
# Depends on cd-auth to obtain the Cloud Run service URL.
# ============================================================================
  cd-api-gateway:
    name: CD — API Gateway (Google Cloud)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve openapi.yaml (envsubst)
        working-directory: api-gateway
        run: |
          SUFFIX="${{ needs.cd-setup.outputs.service_suffix }}"
          if [ "$SUFFIX" = "prod" ]; then
            export AUTH_SERVICE_URL="${{ secrets.AUTH_SERVICE_URL_PROD }}"
            export GATEWAY_HOST="${{ secrets.GATEWAY_HOST_PROD }}"
          else
            export AUTH_SERVICE_URL="${{ secrets.AUTH_SERVICE_URL_TESTING }}"
            export GATEWAY_HOST="${{ secrets.GATEWAY_HOST_TESTING }}"
          fi
          export FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          envsubst < openapi.yaml > openapi-resolved.yaml
          echo "openapi.yaml resolved for env: $SUFFIX"

      - name: Create or update API Gateway config
        working-directory: api-gateway
        run: |
          SUFFIX="${{ needs.cd-setup.outputs.service_suffix }}"
          API_ID="buenvivir-api-$SUFFIX"
          CONFIG_ID="config-${{ github.sha }}"
          REGION="${{ secrets.GCP_REGION }}"

          # Ensure the API exists
          gcloud api-gateway apis create "$API_ID" \
            --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null || echo "API already exists."

          # Create a new config version pinned to this SHA
          gcloud api-gateway api-configs create "$CONFIG_ID" \
            --api="$API_ID" \
            --openapi-spec=openapi-resolved.yaml \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --backend-auth-service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}"

          # Deploy the new config to the gateway
          gcloud api-gateway gateways update "buenvivir-gateway-$SUFFIX" \
            --api="$API_ID" \
            --api-config="$CONFIG_ID" \
            --location="$REGION" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            || \
          gcloud api-gateway gateways create "buenvivir-gateway-$SUFFIX" \
            --api="$API_ID" \
            --api-config="$CONFIG_ID" \
            --location="$REGION" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

          echo "API Gateway deployed: buenvivir-gateway-$SUFFIX"

# ============================================================================
# JOB: cd-frontend
# Deploy Angular build to Cloudflare Pages.
# ============================================================================
  cd-frontend:
    name: CD — Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [cd-setup]

    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ./dist-angular

      - name: Deploy to Cloudflare Pages
        id: deploy-cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy ./dist-angular
            --project-name=${{ secrets.CLOUDFLARE_PROJECT }}-${{ needs.cd-setup.outputs.service_suffix }}

# ============================================================================
# JOB: cd-smoke
# Basic health checks against all deployed services.
# ============================================================================
  cd-smoke:
    name: CD — Smoke Tests
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth, cd-api-gateway, cd-frontend]

    steps:
      - name: Smoke test — Auth Service (/health)
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          echo "Testing Auth health: $AUTH_URL/health"
          curl --fail --silent --show-error --max-time 15 "$AUTH_URL/health"
          echo "Auth health: OK"

      - name: Smoke test — Auth login endpoint (expect 400/422)
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 15 -X POST "$AUTH_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"wrong"}')
          echo "Login endpoint status: $STATUS"
          if [ "$STATUS" != "400" ] && [ "$STATUS" != "401" ] && [ "$STATUS" != "422" ]; then
            echo "::error::Auth login endpoint returned unexpected status $STATUS"
            exit 1
          fi
          echo "Auth login endpoint: OK"

# ============================================================================
# JOB: cd-dast-zap
# OWASP ZAP Baseline Scan post-deploy (testing env: blocking / prod: warning).
# ============================================================================
  cd-dast-zap:
    name: CD — DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-smoke, cd-auth]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan — Auth Service
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: '${{ needs.cd-auth.outputs.service_url }}'
          rules_file_name: 'auth/zap.yaml'
          fail_action: ${{ needs.cd-setup.outputs.env_name == 'TEST' && 'true' || 'false' }}
          artifact_name: zap-auth-report-${{ github.sha }}

# ============================================================================
# JOB: cd-load-k6
# k6 load tests against Auth Service. Only runs on 'testing' branch.
# ============================================================================
  cd-load-k6:
    name: CD — Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-smoke, cd-auth]
    if: needs.cd-setup.outputs.env_name == 'TESTING'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run k6 load tests
        run: |
          AUTH_URL="${{ needs.cd-auth.outputs.service_url }}"
          echo "Running k6 against: $AUTH_URL"
          docker run --rm -i grafana/k6 run \
            -e BASE_URL="$AUTH_URL" - < auth/load_test.js

# ============================================================================
# JOB: cd-rollback
# Automatic rollback if smoke tests fail.
# ============================================================================
  cd-rollback:
    name: CD — Rollback (auto)
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-auth, cd-frontend, cd-smoke]
    if: failure() && needs.cd-smoke.result == 'failure'

    steps:
      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Rollback Auth (Cloud Run — previous revision)
        run: |
          SERVICE="${{ secrets.CLOUD_RUN_SERVICE_AUTH }}-${{ needs.cd-setup.outputs.service_suffix }}"
          REGION="${{ secrets.GCP_REGION }}"
          PREV="${{ needs.cd-auth.outputs.prev_revision }}"
          if [ -n "$PREV" ]; then
            echo "Rolling back Cloud Run to revision: $PREV"
            gcloud run services update-traffic "$SERVICE" \
              --region="$REGION" \
              --to-revisions "$PREV=100"
            echo "Cloud Run rollback complete."
          else
            echo "::warning::No previous revision found. Manual intervention required."
          fi

      - name: Rollback Frontend (Cloudflare Pages)
        run: |
          echo "::error::Smoke tests failed. Cloudflare deployment may need manual rollback."
          echo "Use: wrangler pages deployment rollback --project-name=${{ secrets.CLOUDFLARE_PROJECT }}-${{ needs.cd-setup.outputs.service_suffix }}"
        continue-on-error: true

      - name: Mark CD as failed
        run: |
          echo "::error::Rollback executed. CD failed for SHA ${{ github.sha }}."
          exit 1
