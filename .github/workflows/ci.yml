name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

# ============================================================================
# JOB: ci-frontend
# ============================================================================
jobs:
  ci-frontend:
    name: CI — Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Stage 1 — Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # Stage 2 — Quality (Lint + Format)
      # -----------------------------------------------------------------------
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --ext .ts,.html

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,html,css,json}"

      # -----------------------------------------------------------------------
      # Stage 3 — Unit Tests + Coverage
      # -----------------------------------------------------------------------
      - name: Unit tests (Karma/Jasmine) + coverage
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          retention-days: 7

      # -----------------------------------------------------------------------
      # Stage 4 — Contract Tests (Pact consumer — placeholder)
      # Activate when Pact Broker is provisioned.
      # -----------------------------------------------------------------------
      # - name: Pact consumer contract tests
      #   working-directory: frontend
      #   run: |
      #     npx pact-node --consumer "Frontend-Angular-Client" \
      #       --provider "Auth-Service-Go" \
      #       --pact-broker-url ${{ secrets.PACT_BROKER_URL }} \
      #       --broker-token ${{ secrets.PACT_BROKER_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 5 — Security (SAST + SCA + Secrets)
      # -----------------------------------------------------------------------
      - name: SAST — Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: SCA — pnpm audit (block HIGH/CRITICAL)
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: Secrets — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 6 — Build (Production)
      # -----------------------------------------------------------------------
      - name: Build Angular (production)
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: frontend/dist/frontend-buen-vivir/browser
          retention-days: 7

# ============================================================================
# JOB: ci-auth
# ============================================================================
  ci-auth:
    name: CI — Auth Service (Go)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Stage 1 — Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: auth/go.sum

      - name: Download Go dependencies
        working-directory: auth
        run: go mod download

      # -----------------------------------------------------------------------
      # Stage 2 — Quality (Lint)
      # -----------------------------------------------------------------------
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: auth

      # -----------------------------------------------------------------------
      # Stage 3 — Unit + Integration Tests + Coverage
      # -----------------------------------------------------------------------
      - name: Unit + integration tests + coverage
        working-directory: auth
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Enforce coverage threshold (70%)
        working-directory: auth
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the required 70% threshold."
            exit 1
          fi

      - name: Upload auth coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-${{ github.sha }}
          path: auth/coverage.out
          retention-days: 7

      # -----------------------------------------------------------------------
      # Stage 4 — Contract Tests (Pact — Provider side)
      # -----------------------------------------------------------------------
      - name: Contract tests — Auth provider (Pact)
        working-directory: auth
        run: go test -v ./tests/contract/...

      # -----------------------------------------------------------------------
      # Stage 5 — Security (SAST + SCA)
      # -----------------------------------------------------------------------
      - name: SAST — gosec
        uses: securego/gosec-action@v2
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'
          working-directory: auth
        continue-on-error: true

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: auth/gosec-results.sarif
        continue-on-error: true

      - name: SCA — govulncheck
        working-directory: auth
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # -----------------------------------------------------------------------
      # Stage 6 — Docker Build + Image Scan (Trivy)
      # -----------------------------------------------------------------------
      - name: Docker build (auth)
        run: docker build -t auth:${{ github.sha }} -f auth/Dockerfile ./auth

      - name: Trivy image scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'auth:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # -----------------------------------------------------------------------
      # Stage 7 — Push to Artifact Registry (testing / main only)
      # -----------------------------------------------------------------------
      - name: Authenticate GCP (Workload Identity)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Push image to Artifact Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        run: |
          IMAGE_URI="${{ secrets.ARTIFACT_REGISTRY_REPO }}/auth:${{ github.sha }}"
          docker tag auth:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

# ============================================================================
# JOB: ci-api-gateway
# ============================================================================
  ci-api-gateway:
    name: CI — API Gateway (OpenAPI spec)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for swagger-cli)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli

      # Substitute placeholders with dummy values for static validation only
      - name: Substitute env vars in openapi.yaml
        working-directory: api-gateway
        run: |
          export GATEWAY_HOST="validate.example.com"
          export AUTH_SERVICE_URL="https://auth.example.com"
          export FIREBASE_PROJECT_ID="validate-project"
          envsubst < openapi.yaml > openapi-resolved.yaml

      - name: Validate OpenAPI spec (swagger-cli)
        working-directory: api-gateway
        run: swagger-cli validate openapi-resolved.yaml

      - name: Verify OWASP security headers in nginx.conf
        working-directory: api-gateway
        run: |
          echo "Verifying required OWASP headers in nginx.conf..."
          grep -q "X-Content-Type-Options" nginx.conf  || { echo "::error::Missing X-Content-Type-Options header"; exit 1; }
          grep -q "X-Frame-Options" nginx.conf          || { echo "::error::Missing X-Frame-Options header"; exit 1; }
          grep -q "Strict-Transport-Security" nginx.conf || { echo "::error::Missing HSTS header"; exit 1; }
          grep -q "Referrer-Policy" nginx.conf          || { echo "::error::Missing Referrer-Policy header"; exit 1; }
          echo "All required OWASP headers present."

# ============================================================================
# JOB: ci-gate
# ============================================================================
  ci-gate:
    name: CI — Gate (all jobs must pass)
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-auth, ci-api-gateway]
    if: always()

    steps:
      - name: Fail if any CI job failed
        run: |
          if [ "${{ needs.ci-frontend.result }}" != "success" ]; then
            echo "::error::ci-frontend failed."
            exit 1
          fi
          if [ "${{ needs.ci-auth.result }}" != "success" ]; then
            echo "::error::ci-auth failed."
            exit 1
          fi
          if [ "${{ needs.ci-api-gateway.result }}" != "success" ]; then
            echo "::error::ci-api-gateway failed."
            exit 1
          fi
          echo "All CI jobs passed. Gate cleared."
