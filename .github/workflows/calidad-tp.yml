name: TP Calidad — CI (Educación)


# Pipeline de CI del TP: no despliega nada. En cada corrida:
#   1. sonarqube-education: pruebas (unitarias, integración y contrato),
#      cobertura y quality gate del Nivel 3, con un SonarQube temporal.
#   2. seguridad-education: análisis estático de seguridad (en paralelo).
#   3. servicio-education: levanta Educación dentro del runner con
#      docker-compose.calidad.yml y corre smoke, E2E y stress contra él.
#   4. mutacion-education y el esfuerzo sostenido: solo a pedido (Run
#      workflow), porque tardan mucho para cada push.
# La evidencia queda en el resumen de cada corrida y en sus artefactos.

on:
  push:
    branches:
      - 'Calidad'
  workflow_dispatch:
    inputs:
      esfuerzo_sostenido:
        description: 'Correr el esfuerzo sostenido (ST-2, 60 minutos)'
        type: boolean
        default: false
      mutacion:
        description: 'Correr las pruebas de mutación (gremlins)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calidad-tp-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  SCANNER_VERSION: 8.1.0.6389
  INICIO_CODIGO_NUEVO: '2026-08-01'
  # Herramientas de seguridad: versiones fijas para que dos corridas del
  # mismo commit den lo mismo.
  GOSEC_VERSION: v2.29.0
  GOVULNCHECK_VERSION: v1.1.4
  GITLEAKS_VERSION: v8.21.2
  SEMGREP_VERSION: 1.95.0
  TRIVY_VERSION: 0.75.0

jobs:
  sonarqube-education:
    name: SonarQube + quality gate — Educación
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Misma versión que la instalación local (D-04).
      sonarqube:
        image: sonarqube:26.8.0.126808-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
      # Mismo emulador que usa ci-education en pipeline.yml: sin él, los
      # tests de Firestore se saltean y la cobertura baja.
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390
      SONAR_HOST_URL: http://localhost:9000
      SONAR_SCANNER: sonar-scanner

    steps:
      # Historia completa: SonarQube usa las fechas de Git para saber qué
      # líneas son código nuevo, y linea_base.sh necesita el commit del 1/8.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: education/go.sum

      - name: Instalar SonarScanner CLI (con verificación SHA-256)
        run: |
          BASE=https://binaries.sonarsource.com/Distribution/sonar-scanner-cli
          ZIP=sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip
          curl -sSfLO "$BASE/$ZIP"
          echo "$(curl -sSfL "$BASE/$ZIP.sha256")  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Esperar a SonarQube
        run: |
          for i in $(seq 1 60); do
            if curl -s "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube listo"; exit 0
            fi
            echo "esperando a SonarQube ($i/60)..."; sleep 5
          done
          echo "::error::SonarQube no arrancó"; exit 1

      - name: Crear token de análisis
        run: |
          CLAVE="Tp-$(openssl rand -hex 16)-A1!"
          echo "::add-mask::$CLAVE"
          curl -sf -u admin:admin -X POST "$SONAR_HOST_URL/api/users/change_password" \
            -d login=admin -d previousPassword=admin --data-urlencode "password=$CLAVE"
          TOKEN=$(curl -sf -u "admin:$CLAVE" -X POST "$SONAR_HOST_URL/api/user_tokens/generate" \
            -d name=calidad-tp -d type=USER_TOKEN | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Configurar proyecto y quality gate TP-Calidad-N3
        run: bash scripts/calidad/configurar_sonar.sh

      - name: Registrar la línea base del 1/8
        run: bash scripts/calidad/linea_base.sh

      - name: Esperar al emulador de Firestore
        run: |
          for i in $(seq 1 30); do
            if curl -s "http://localhost:8390/" >/dev/null 2>&1; then
              echo "Emulador listo"; exit 0
            fi
            echo "esperando al emulador ($i/30)..."; sleep 2
          done
          echo "::error::El emulador de Firestore no arrancó"; exit 1

      # Corre las pruebas existentes, analiza y espera el
      # quality gate. Si el gate da rojo, este paso falla.
      - name: Pruebas, cobertura y análisis SonarQube
        id: analisis
        run: bash scripts/calidad/analizar.sh education

      - name: Resumen de la corrida
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          filas = list(csv.DictReader(open("docs/calidad/reportes/historial.csv", encoding="utf-8")))
          f = filas[-1]
          print(f"### Educación — quality gate: **{f['quality_gate']}**\n")
          print(f"Versión analizada: `{f['commit']}` · pruebas en verde: **{f['tests_en_verde']}**\n")
          print("| Métrica | Valor |\n|---|---|")
          for clave, nombre in [
              ("coverage", "Cobertura total (%)"), ("new_coverage", "Cobertura código nuevo (%)"),
              ("duplicated_lines_density", "Duplicación (%)"),
              ("new_duplicated_lines_density", "Duplicación código nuevo (%)"),
              ("software_quality_reliability_issues", "Problemas de confiabilidad (bugs)"),
              ("software_quality_security_issues", "Problemas de seguridad"),
              ("software_quality_maintainability_issues", "Problemas de mantenibilidad"),
              ("complexity", "Complejidad ciclomática"), ("ncloc", "Líneas de código"),
              ("tests", "Pruebas"), ("test_failures", "Pruebas fallidas")]:
              print(f"| {nombre} | {f.get(clave) or 'sin dato'} |")
          EOF

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-education-${{ github.sha }}
          path: |
            docs/calidad/reportes/
            education/coverage.out
            education/test-report.json
            education/.scannerwork/report-task.txt
          retention-days: 30
          if-no-files-found: warn

      # Exige que las pruebas hayan pasado y que el Quality Gate de SonarQube esté en verde.
      - name: Exigir pruebas en verde y quality gate
        run: |
          tail -1 docs/calidad/reportes/historial.csv | grep -q ',si,' \
            || { echo "::error::Hay pruebas fallidas en education"; exit 1; }
          tail -1 docs/calidad/reportes/historial.csv | grep -q ',OK,' \
            || { echo "::error::El Quality Gate de SonarQube no fue superado"; exit 1; }

  # Análisis de seguridad de Educación, en paralelo con SonarQube. Todo es
  # análisis estático: lee el código, las librerías y la imagen, sin
  # ejecutar el servicio. Todas las herramientas frenan ante hallazgos
  # de seguridad bloqueantes (ver scripts/calidad/resumen_seguridad.py).
  seguridad-education:
    name: Seguridad — Educación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORTES: ${{ github.workspace }}/reportes-seguridad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: education/go.sum

      - name: Instalar herramientas
        run: |
          mkdir -p "$REPORTES"
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          BASE=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          TGZ=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSfLO "$BASE/$TGZ"
          curl -sSfL "$BASE/trivy_${TRIVY_VERSION}_checksums.txt" | grep " $TGZ\$" | sha256sum -c -
          tar -xzf "$TGZ" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gosec — errores de seguridad en el código Go
        working-directory: education
        run: $(go env GOPATH)/bin/gosec -quiet -fmt=json -out="$REPORTES/gosec.json" ./... || true

      - name: govulncheck — vulnerabilidades conocidas en librerías
        working-directory: education
        run: |
          set +e
          $(go env GOPATH)/bin/govulncheck ./... > "$REPORTES/govulncheck.txt" 2>&1
          echo $? > "$REPORTES/govulncheck.exit"
          cat "$REPORTES/govulncheck.txt"

      - name: Gitleaks — claves escritas en archivos
        run: $(go env GOPATH)/bin/gitleaks dir education --redact --no-banner -f json -r "$REPORTES/gitleaks.json" || true

      - name: Semgrep — patrones de código inseguro
        run: semgrep scan --config p/golang --metrics=off --json --output "$REPORTES/semgrep.json" education || true

      - name: Trivy — vulnerabilidades en la imagen Docker
        run: |
          docker build -q -t education-calidad:${{ github.sha }} ./education
          trivy image --quiet --format json --output "$REPORTES/trivy.json" \
            --ignore-unfixed --pkg-types os,library education-calidad:${{ github.sha }}

      - name: Resumen y veredicto
        run: python3 scripts/calidad/resumen_seguridad.py "$REPORTES" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-education-${{ github.sha }}
          path: reportes-seguridad/
          retention-days: 30
          if-no-files-found: warn

  # Pruebas sobre el servicio funcionando, sin desplegar: levanta el entorno
  # de calidad (Educación + emulador de Firestore + auth-service de prueba,
  # con Contentful "testing") dentro del runner, carga los datos de prueba
  # por la API y corre las pruebas contra http://127.0.0.1:18210.
  # Los scripts de smoke, E2E y stress están a cargo de Leonardo y van en
  # scripts/calidad/pruebas/. Mientras uno no exista, su paso avisa y queda
  # como "pendiente" en el resumen: no se da por aprobado.
  servicio-education:
    name: Smoke, E2E y stress — Educación
    runs-on: ubuntu-latest
    needs: [sonarqube-education]
    timeout-minutes: 90
    env:
      BASE_URL: http://127.0.0.1:18210
      PRUEBAS: scripts/calidad/pruebas
      REPORTES: ${{ github.workspace }}/reportes-servicio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Mismo contenido que arma preparar_env.sh, pero desde los secrets.
      # docker-compose.calidad.yml fuerza Contentful "testing" y el servicio
      # no arranca con "master".
      - name: Armar .env.calidad
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_CDA_TOKEN: ${{ secrets.CONTENTFUL_CDA_TOKEN }}
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
          CONTENTFUL_LOCALE: ${{ secrets.CONTENTFUL_LOCALE }}
        run: |
          umask 077
          {
            echo "CONTENTFUL_SPACE_ID=$CONTENTFUL_SPACE_ID"
            echo "CONTENTFUL_CDA_TOKEN=$CONTENTFUL_CDA_TOKEN"
            echo "CONTENTFUL_CMA_TOKEN=$CONTENTFUL_CMA_TOKEN"
            echo "CONTENTFUL_LOCALE=$CONTENTFUL_LOCALE"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > scripts/calidad/entorno/.env.calidad
          mkdir -p "$REPORTES"

      - name: Levantar el entorno de calidad
        run: docker compose -f docker-compose.calidad.yml up -d --build

      - name: Esperar a Educación
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/salud" > /dev/null; then
              curl -s "$BASE_URL/api/salud"; echo; exit 0
            fi
            echo "esperando a Educación ($i/60)..."; sleep 3
          done
          echo "::error::Educación no arrancó"; exit 1

      - name: Cargar datos de prueba por la API
        run: python3 scripts/calidad/entorno/cargar_por_api.py --api "$BASE_URL"

      # Cada script recibe BASE_URL y REPORTES, deja su reporte en REPORTES
      # y termina con error si la prueba no pasa. Los tokens de prueba se
      # piden con scripts/calidad/entorno/token_prueba.py <rol>.
      - name: Smoke test
        id: smoke
        run: |
          if [ ! -f "$PRUEBAS/smoke.sh" ]; then
            echo "::warning::Falta $PRUEBAS/smoke.sh: smoke pendiente"
            echo "estado=pendiente" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash "$PRUEBAS/smoke.sh"
          echo "estado=aprobado" >> "$GITHUB_OUTPUT"

      - name: E2E
        id: e2e
        run: |
          if [ ! -f "$PRUEBAS/e2e.sh" ]; then
            echo "::warning::Falta $PRUEBAS/e2e.sh: E2E pendiente"
            echo "estado=pendiente" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash "$PRUEBAS/e2e.sh"
          echo "estado=aprobado" >> "$GITHUB_OUTPUT"

      # ST-1: 20 → 50 → 100 → 200 usuarios, 2 min cada escalón. Los umbrales
      # del plan (p95 > 2 s o errores > 5 %) van como thresholds del script.
      - name: Stress (ST-1, k6)
        id: stress
        run: |
          if [ ! -f "$PRUEBAS/stress.js" ]; then
            echo "::warning::Falta $PRUEBAS/stress.js: stress pendiente"
            echo "estado=pendiente" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm --network host -u "$(id -u)" -v "$PWD:/repo" -w /repo \
            -e BASE_URL -e REPORTES=/repo/reportes-servicio grafana/k6:0.54.0 \
            run --summary-export reportes-servicio/stress-resumen.json "$PRUEBAS/stress.js"
          echo "estado=aprobado" >> "$GITHUB_OUTPUT"

      # ST-2: 20 usuarios durante 60 minutos. Solo a pedido (Run workflow).
      - name: Esfuerzo sostenido (ST-2, k6)
        id: sostenido
        if: github.event_name == 'workflow_dispatch' && inputs.esfuerzo_sostenido
        run: |
          if [ ! -f "$PRUEBAS/esfuerzo_sostenido.js" ]; then
            echo "::warning::Falta $PRUEBAS/esfuerzo_sostenido.js: esfuerzo sostenido pendiente"
            echo "estado=pendiente" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm --network host -u "$(id -u)" -v "$PWD:/repo" -w /repo \
            -e BASE_URL -e REPORTES=/repo/reportes-servicio grafana/k6:0.54.0 \
            run --summary-export reportes-servicio/sostenido-resumen.json "$PRUEBAS/esfuerzo_sostenido.js"
          docker stats --no-stream > "$REPORTES/memoria-al-terminar.txt"
          echo "estado=aprobado" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outputs.estado || steps.smoke.outcome }}
          E2E: ${{ steps.e2e.outputs.estado || steps.e2e.outcome }}
          STRESS: ${{ steps.stress.outputs.estado || steps.stress.outcome }}
          SOSTENIDO: ${{ steps.sostenido.outputs.estado || steps.sostenido.outcome }}
        run: |
          {
            echo "### Educación — pruebas sobre el servicio"
            echo ""
            echo "| Prueba | Resultado |"
            echo "|---|---|"
            echo "| Smoke | $SMOKE |"
            echo "| E2E | $E2E |"
            echo "| Stress (ST-1) | $STRESS |"
            echo "| Esfuerzo sostenido (ST-2) | ${SOSTENIDO:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs del servicio
        if: failure()
        run: docker compose -f docker-compose.calidad.yml logs --tail 200 education-calidad

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicio-education-${{ github.sha }}
          path: reportes-servicio/
          retention-days: 30
          if-no-files-found: warn

      - name: Apagar el entorno
        if: always()
        run: |
          docker compose -f docker-compose.calidad.yml down
          rm -f scripts/calidad/entorno/.env.calidad

  # Mutación con gremlins: mide si las pruebas detectan cambios en el código.
  # Tarda mucho, así que corre solo a pedido. Es el job que está apagado en
  # pipeline.yml, ahora dentro del CI del TP.
  mutacion-education:
    name: Mutación — Educación (gremlins)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mutacion
    needs: [sonarqube-education]
    timeout-minutes: 60

    services:
      firestore:
        image: mtlynch/firestore-emulator:latest
        ports:
          - 8390:8080

    env:
      FIRESTORE_EMULATOR_HOST: localhost:8390

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: education/go.sum

      - name: Instalar gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0

      - name: Correr gremlins
        working-directory: education
        run: |
          set -o pipefail
          $(go env GOPATH)/bin/gremlins unleash ./internal/... | tee mutation_report.txt
          {
            echo "### Educación — mutación"
            echo '```'
            tail -n 20 mutation_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutacion-education-${{ github.sha }}
          path: education/mutation_report.txt
          retention-days: 30
          if-no-files-found: warn
