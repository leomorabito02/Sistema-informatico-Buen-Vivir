name = "buen-vivir-impact-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# WORKER_SYNC_TOKEN se inyecta de manera segura usando `wrangler secret put WORKER_SYNC_TOKEN`

# Development / Staging environment
[env.staging]
name = "buen-vivir-impact-staging"
kv_namespaces = [
  { binding = "IMPACT_KV", id = "aef6384f69e8414692341be8239c802d" }
]

# Production environment
[env.production]
name = "buen-vivir-impact-prod"
kv_namespaces = [
  { binding = "IMPACT_KV", id = "efb9aae39654471e9b5292380a90be3e" }
]

