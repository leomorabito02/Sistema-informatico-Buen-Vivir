name = "buen-vivir-impact-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
WORKER_SYNC_TOKEN = "your-sync-token-secret"

# Development / Staging environment
[env.staging]
name = "buen-vivir-impact-staging"
kv_namespaces = [
  { binding = "IMPACT_KV", id = "STAGING_KV_NAMESPACE_ID" }
]

# Production environment
[env.production]
name = "buen-vivir-impact-prod"
kv_namespaces = [
  { binding = "IMPACT_KV", id = "PROD_KV_NAMESPACE_ID" }
]
