# Análisis estático de Educación con SonarQube (TP de Calidad, eje 3).
# Documentación: docs/calidad/03-metricas-y-analisis-estatico.md
#
# Se corre desde education/ con scripts/calidad/sonar/analizar.sh, que antes
# genera coverage.out y test-report.json con go test.

sonar.projectKey=buenvivir-education
sonar.projectName=Buen Vivir - Educación

# Código de producción: todo el módulo menos los tests y los reportes
# generados por las herramientas (zap_report.html, sast_report.json,
# sca_report.txt, mutation_report.txt, zap.yaml): no son código. No se
# versionan, pero quedan en la carpeta cuando se corren los scripts.
sonar.sources=.
sonar.exclusions=**/*_test.go,tests/**,**/testdata/**,**/*.md,**/*.js,**/*.sh,Dockerfile,**/*.html,**/*.json,**/*.txt,**/*.yaml,**/*.yml

# Pruebas: los *_test.go y la carpeta tests/ (contrato, base de datos, Pub/Sub).
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**/*.go

# Informes que genera go test (no se versionan).
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

sonar.sourceEncoding=UTF-8
