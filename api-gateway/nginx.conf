worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Logging JSON estructurado
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"request_time":"$request_time"}';

    access_log /dev/stdout json_combined;

    # Rate Limiting global (10 req/s por IP, con ráfaga de 20)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # CORS Dinámico
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost(:\d+)?$" $http_origin;
        "~^https://.*\.ceibuenvivir\.org$" $http_origin;
        "~^https://.*\.ceibuenvivir\.pages\.dev$" $http_origin;
    }

    server {
        listen       80;
        server_name  localhost;

        # Rate limiting por defecto en este server
        limit_req zone=api_limit burst=20 nodelay;

        # --- HEADERS GLOBALES ---
        # CORS
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # OWASP Security Headers
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'DENY' always;
        add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains; preload' always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'Permissions-Policy' 'geolocation=(), microphone=(), camera=()' always;

        # Manejo de OPTIONS global para CORS preflight
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # --- AUTENTICACIÓN ---
        # Endpoint interno de validación
        location = /internal/validate-token {
            internal;
            proxy_pass http://auth-service:8080/internal/validate-token;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rutas de autenticación públicas (Login / Register / etc)
        location /api/v1/auth/ {
            proxy_pass http://auth-service:8080/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- RUTAS PROTEGIDAS AUTH SERVICE ---
        location ~ ^/api/v1/(users|roles|companies|teachers|participants|permissions|volunteers|profile|auth/me)/ {
            auth_request /internal/validate-token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            
            proxy_pass http://auth-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # --- RUTAS EDUCATION SERVICE ---
        # location ~ ^/api/(cursos|areas-formativas|materiales|salud) {
        #     # Separamos GET/OPTIONS (público) de los demás (protegido)
        #     error_page 418 = @auth_education;
        #     if ($request_method !~ ^(GET|OPTIONS|HEAD)$) {
        #         return 418;
        #     }
        # 
        #     proxy_pass http://education-service:8080;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
        # 
        # location @auth_education {
        #     auth_request /internal/validate-token;
        #     auth_request_set $user_id $upstream_http_x_user_id;
        #     auth_request_set $user_role $upstream_http_x_user_role;
        #     
        #     proxy_pass http://education-service:8080;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-User-ID $user_id;
        #     proxy_set_header X-User-Role $user_role;
        # }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
