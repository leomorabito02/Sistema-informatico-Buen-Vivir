worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Logging JSON estructurado
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"request_time":"$request_time"}';

    access_log /dev/stdout json_combined;

    # Rate Limiting global (10 req/s por IP, con ráfaga de 20)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # CORS Dinámico
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost(:\d+)?$" $http_origin;
        "~^https://.*\.ceibuenvivir\.org$" $http_origin;
        "~^https://.*\.ceibuenvivir\.pages\.dev$" $http_origin;
    }

    server {
        listen       80;
        server_name  localhost;

        # Configurar tamaño máximo del body global para evitar error 413 en subrequests
        client_max_body_size 50m;

        # Rate limiting por defecto en este server
        limit_req zone=api_limit burst=20 nodelay;

        # --- HEADERS GLOBALES ---
        # CORS — el gateway es la ÚNICA fuente de headers CORS. auth-service y
        # education-service también los emiten; los ocultamos del upstream
        # (proxy_hide_header más abajo) para que el browser reciba una sola
        # copia y no rechace la respuesta por "multiple values".
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Link, Set-Cookie' always;

        # OWASP Security Headers
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'DENY' always;
        add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains; preload' always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'Permissions-Policy' 'geolocation=(), microphone=(), camera=()' always;

        # Manejo de OPTIONS global para CORS preflight
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # Ocultar los headers CORS que ya manda el upstream (auth/education):
        # sin esto llegan duplicados y el browser corta la request.
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        proxy_hide_header 'Access-Control-Max-Age';
        proxy_hide_header 'Vary';

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # --- AUTENTICACIÓN ---
        # Endpoint interno de validación
        location = /internal/validate-token {
            internal;
            proxy_pass http://auth-service:8080/internal/validate-token;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rutas de autenticación públicas (Login / Register / etc)
        location /api/v1/auth/ {
            proxy_pass http://auth-service:8080/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID "";
            proxy_set_header X-User-Role "";
        }

        # --- RUTAS PROTEGIDAS AUTH SERVICE ---
        # El (/|$) del final hace que matcheen tanto la colección
        # (GET /api/v1/users) como el item (GET /api/v1/users/{id}).
        location ~ ^/api/v1/(users|roles|companies|teachers|participants|permissions|volunteers|profile|auth/me)(/|$) {
            auth_request /internal/validate-token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://auth-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # --- RUTAS RXRESUME SERVICE PÚBLICAS ---
        # proxy_pass con variable + resolver (DNS embebido de Docker): nginx
        # resuelve rxresume-service recién al atender el request, no al
        # arrancar. Si ese container no está levantado solo fallan estas
        # rutas (502) en vez de "host not found in upstream", que tumbaba
        # TODO el gateway (auth y education incluidos).
        location ~ ^/api/v1/rxresume/public {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $rxresume_upstream http://rxresume-service:8080;
            proxy_pass $rxresume_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID "";
            proxy_set_header X-User-Role "";
        }

        # --- RUTAS RXRESUME SERVICE PROTEGIDAS ---
        location ~ ^/api/v1/rxresume {
            auth_request /internal/validate-token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            resolver 127.0.0.11 valid=30s ipv6=off;
            set $rxresume_upstream http://rxresume-service:8080;
            proxy_pass $rxresume_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;

            client_max_body_size 10m;
        }

        # --- RUTAS LABOR INTEGRATION SERVICE ---
        location ~ ^/api/v1/labor-integration {
            auth_request /internal/validate-token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            # Variable + resolver (mismo criterio que rxresume): si el container
            # no está levantado fallan solo estas rutas, no todo el gateway.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $labor_upstream http://labor-integration:8080;
            proxy_pass $labor_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;
        }


        # --- RUTAS HUMAN PROMOTION SERVICE ---
        # human-promotion valida el JWT por su cuenta (cookie o Authorization:
        # Bearer) y hace su propio RBAC, igual que education: el gateway solo
        # proxea. Variable + resolver para que, si el container no está
        # levantado, fallen solo estas rutas (502) y no todo el gateway.
        location ~ ^/api/v1/human-promotion {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $human_promotion_upstream http://human-promotion:8085;
            proxy_pass $human_promotion_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1m;
        }

        # --- RUTAS EDUCATION SERVICE ---
        # education-service valida el JWT por su cuenta (cookie access_token
        # o Authorization: Bearer) y hace su propio RBAC, así que el gateway
        # solo proxea. Escucha en el puerto 8210.
        location ~ ^/api/(cursos|areas-formativas|materiales|docentes?|salud|actividades|asistencia-general|participante|entregas|participants|bulk-cursos-usuarios) {
            proxy_pass http://education-service:8210;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # subida de materiales (POST /api/materiales/upload, 12 MB) y
            # entregas de actividades (POST /api/participante/actividades/
            # {id}/entrega: hasta 5 adjuntos de 10 MB + texto)
            client_max_body_size 55m;
            proxy_read_timeout 120s;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
