swagger: '2.0'
info:
  title: Sistema Informático Buen Vivir API Gateway
  description: API Gateway de Google Cloud para el Sistema Informático Buen Vivir
  version: 1.0.0
host: ${GATEWAY_HOST}
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
paths:
  /api/v1/auth/login:
    post:
      summary: Autenticación de usuarios
      operationId: authLogin
      x-google-backend:
        address: ${AUTH_SERVICE_URL}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales inválidas

  /api/v1/auth/register:
    post:
      summary: Registro de usuarios
      operationId: authRegister
      x-google-backend:
        address: ${AUTH_SERVICE_URL}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '201':
          description: Usuario creado exitosamente
        '400':
          description: Datos inválidos



securityDefinitions:
  # Validación de tokens JWT internos generados por nuestro Backend
  jwt:
    type: apiKey
    name: Authorization
    in: header
    x-google-issuer: "buenvivir-auth"
    x-google-jwks_uri: "${AUTH_SERVICE_URL}/.well-known/jwks.json"
    
  # Validación directa de Firebase Auth (Opcional si el gateway valida el login inicial)
  firebase:
    authorizationUrl: ""
    flow: "implicit"
    type: "oauth2"
    x-google-issuer: "https://securetoken.google.com/${FIREBASE_PROJECT_ID}"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com"
    x-google-audiences: "${FIREBASE_PROJECT_ID}"
