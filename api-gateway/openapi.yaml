swagger: '2.0'
info:
  title: Sistema Informático Buen Vivir API Gateway
  description: API Gateway de Google Cloud para el Sistema Informático Buen Vivir
  version: 1.0.0
host: buenvivir-gateway.apigateway.project-id.gateway.dev
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
paths:
  /api/v1/auth/login:
    post:
      summary: Autenticación de usuarios
      operationId: authLogin
      x-google-backend:
        address: https://auth-service-url-cloudrun.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales inválidas

  /api/v1/campaigns:
    get:
      summary: Listar campañas
      operationId: getCampaigns
      x-google-backend:
        address: https://campaigns-service-url-cloudrun.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: Lista de campañas
